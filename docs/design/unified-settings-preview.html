function effective(key){return scope!=='shared'&&Object.hasOwn(overrides[scope],key)?overrides[scope][key]:globalValues[key];}
function editable(key){return scope==='shared'||(scope==='blog'&&key.startsWith('writing.'))||Object.hasOwn(overrides[scope],key);}
function source(key,label=key){if(scope==='blog'&&key.startsWith('writing.'))return '<span class="source"><span>For new blogs in Blog Studio</span></span>';if(scope==='shared')return '';const custom=Object.hasOwn(overrides[scope],key);return `<span class="source"><span class="origin">${icon(custom?'general':'link')}${custom?'Custom for this studio':'From shared defaults'}</span><button type="button" data-override="${key}" aria-label="${custom?'Use shared':'Customize'} ${esc(label)} for ${names[scope]}">${custom?'Use shared':'Customize'}</button></span>`;}
function field(key,label,help,options,kind='select') {const value=effective(key);const disabled=editable(key)?'':'disabled';let control;if(kind==='toggle')control=`<label class="switch"><input type="checkbox" data-field="${key}" aria-label="${esc(label)}" ${value?'checked':''} ${disabled}></label>`;else if(kind==='textarea')control=`<textarea data-field="${key}" aria-label="${esc(label)}" ${disabled}>${esc(value)}</textarea>`;else if(kind==='input'||kind==='number')control=`<input type="${kind==='number'?'number':'text'}" ${kind==='number'?'min="1" max="10000"':''} data-field="${key}" aria-label="${esc(label)}" value="${esc(value)}" ${disabled}>`;else control=`<select data-field="${key}" aria-label="${esc(label)}" ${disabled}>${options.map(option=>{let [v,l]=Array.isArray(option)?option:[option,option];return `<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`;return `<div class="row"><div><h3>${label}</h3><p class="help">${help}</p></div><div class="field">${control}${source(key,label)}</div></div>`;}
function section(title,description,body,badge=''){return `<section class="panel"><div class="section-head"><div><h2>${title}</h2><p>${description}</p></div>${badge?`<span class="pill ${badge==='Global policy'?'blue':''}">${badge}</span>`:''}</div><div class="section-body">${body}</div></section>`;}
function hint(text){return `<p class="hint">${icon('info')}<span>${text}</span></p>`;}
function savebar(){return `<footer class="savebar"><p>${firstRun?'You can change these choices later.':dirty?'You have changes to preview.':page==='limits'?'One global policy. Tighter limits apply before the next job.':'New work starts with these choices. Existing work keeps its settings.'}</p><div>${firstRun?`<button class="secondary" data-action="setup-back">${setupIndex?'Back':'Leave setup'}</button><button class="primary" data-action="setup-next">${setupIndex===2?'Finish setup':'Continue'}</button>`:`<button class="secondary" data-action="discard">Revert</button><button class="primary" data-action="save">${scope==='shared'||page==='limits'?'Save shared defaults':'Save for '+names[scope]}</button>`}</div></footer>`;}
function scopes(){return `<div class="scope" role="group" aria-label="Settings scope">${Object.entries(names).map(([key,name])=>`<button data-scope="${key}" aria-pressed="${scope===key}">${name}</button>`).join('')}</div>${scope==='shared'?'':`<p class="scope-note">${names[scope]} follows shared defaults. Customize only what you want to be different. Global limits always apply.</p>`}`;}
const models=[['default','Assistant’s default'],['sample-fast','Sample · Fast'],['sample-balanced','Sample · Balanced'],['sample-deep','Sample · Deep']];
const effortOptions=[['','Assistant’s default'],['low','Low'],['medium','Medium'],['high','High']];
function modelField(key,label,opts){opts=[['inherit',key.endsWith('.effort')?'Inherit default reasoning':'Inherit default model'],...opts];const value=effective(key);return `<div class="field"><select data-field="${key}" aria-label="${label}" ${editable(key)?'':'disabled'}>${opts.map(([v,l])=>`<option value="${v}" ${String(value)===v?'selected':''}>${l}</option>`).join('')}</select>${source(key,label)}</div>`;}
function modelsPage(){const mode=effective('models.mode');return section('Your assistant','Use the assistant you already sign in to. No extra account or API key.','<div class="assistant-grid">'+field('assistant.agent','Assistant','Your existing CLI sign-in.',[['codex','Codex'],['claude','Claude Code']])+field('assistant.model','Default model','Fallback for inherited profiles.',models)+field('assistant.effort','Default reasoning','Used with the default model.',effortOptions)+'</div>',scope==='shared'?'All studios':names[scope])+section('Choose the right model for the work','Start simple, or give different kinds of work their own model and reasoning level.',`<div class="model-mode" role="group" aria-label="Model routing"><button data-mode="single" aria-pressed="${mode==='single'}" ${editable('models.mode')?'':'disabled'}>One model</button><button data-mode="by_task" aria-pressed="${mode==='by_task'}" ${editable('models.mode')?'':'disabled'}>By task</button></div>${source('models.mode','Model routing')}${mode==='by_task'?`<div class="profile-table"><div class="profile-head"><span>Kind of work</span><span>Model</span><span>Reasoning</span></div>${[['quick','Quick work','Extracting facts, organizing sources and small changes.','quick'],['main','Main work','Research, writing, teaching design and building slides.','models'],['complex','Complex work','Difficult evidence, technical diagrams and focused repairs.','complex']].map(([key,name,description,drawing])=>`<div class="profile-row"><div><div class="profile-title ${key}">${icon(drawing)}${name}</div><p>${description}</p></div>${modelField('models.'+key+'.model',name+' model',models)}${modelField('models.'+key+'.effort',name+' reasoning',effortOptions)}</div>`).join('')}</div>`:`<div class="blank-state"><p class="muted">Every assistant job uses your default model and reasoning.</p></div>`}${hint('This preview uses sample model names. The real interface will list models available to your selected assistant. No account has been queried.')}`,'Automatic routing');}
function generalPage(){return section('You and your studios','A few familiar choices, shared wherever you start.',field('person.name','Your name','Used as a starting author name. Git commit identity is configured separately.',null,'input')+(firstRun?field('assistant.agent','Assistant','Choose the assistant you already sign in to.',[['codex','Codex'],['claude','Claude Code']]):scope==='blog'?'<div class="unavailable">Desktop notifications are not currently supported by Blog Studio. The shared preference remains available to the other studios.</div>':field('preferences.notify','Let me know when I’m needed','Desktop notifications in Presentation Studio and Training Studio, where this computer supports them.',null,'toggle')))+section('Assistant and models','Use one model everywhere, or set up Quick, Main and Complex profiles.',`<div class="readiness" style="border:0;padding:0"><span class="connection-icon">${icon('models')}</span><div class="connection-copy"><h3>${effective('assistant.agent')==='codex'?'Codex':'Claude Code'}</h3><p>${effective('models.mode')==='by_task'?'Models chosen by task':'One model for all work'} · ${scope==='shared'?'Shared with all three studios':'Effective for '+names[scope]}</p></div><button class="secondary" data-go="models">Configure models</button></div>`);}
function workspacePage(){return section('A place for your work','Keep local Git history, or use an existing repository to work with a team.',field('storage','Storage','Both choices keep Git history. A remote repository is optional.',[['local','Local Git on this computer'],['remote','Shared repository']])+(effective('storage')==='local'?field('local.root','Work folder','Each studio gets its own repository inside this folder.',null,'input'):field('team.repository','Repository','Use an existing repository address without credentials.',null,'input')+field('team.branch','Branch','The starting branch for new studio workspaces.',null,'input')+field('share','Share changes','Choose when approved changes are pushed.',[['decision','After each decision'],['asked','When I ask']]))+hint('Existing studio workspaces stay where they are. Changing these defaults never moves your content or reconnects a repository.'))+section('Current workspaces','The real interface shows each native workspace and offers an explicit change action.',`<div class="home-facts" style="padding:0">${['blog','presentation','training'].map(id=>`<div><p>${names[id]}</p><strong>~/Studios/${id}-workspace</strong></div>`).join('')}</div>`,'Sample locations');}
function brandPage(){return section('Your brand library','The skill supplies templates and guidelines. The default brand selects a look inside it.',field('brand.repository','Brand skill repository','Installed and updated only when you choose an explicit installation action.',null,'input')+field('brand.brand','Default brand','New work starts with this brand. Choose another for individual work.',[['northstar','Northstar · Sample brand'],['neutral','Studio neutral · Sample brand']])+field('brand.variant','Default appearance','Choose a variant offered by the selected brand.',[['light','Light'],['dark','Dark']])+`<details class="details"><summary>Installation options</summary>${field('brand.skill','Installed skill folder','Normally found automatically. Set a folder when you have several brand skills.',null,'input')}${field('brand.release','Release tag','Leave blank for the latest release.',null,'input')}</details>`)+section('Delivery and previews','Use the right format for your team, with local files always available.',field('output','Deliver as','Applied to the document and deck formats each studio supports.',[['pptx','PowerPoint and Word files'],['google','Google Slides and Docs']])+(scope==='blog'?'<div class="unavailable">Slide previews are not used by Blog Studio. Your shared preview choice applies to Presentation Studio and Training Studio.</div>':field('render.previews','Slide previews','Used by Presentation Studio and Training Studio.',[['','Match delivery format'],['local','Local · LibreOffice'],['drive','Google Drive']]))+hint('Google delivery and artwork generation are separate capabilities. Saving these choices does not sign in, install tools or generate content.'));}
function limitsPage(){const prior=scope;scope='shared';const html=section('One policy for all studios','Set limits here once. There are no separate studio limit settings or overrides.',field('limits.step_seconds','Maximum time per assistant job','Time spent waiting for a slot does not count toward job duration.',[[300,'5 minutes'],[600,'10 minutes'],[900,'15 minutes'],[1800,'30 minutes'],[3600,'60 minutes']])+field('limits.parallel','Simultaneous assistant jobs','A single total across independently running studios on this computer.',[[1,'1 job at a time'],[2,'Up to 2 jobs'],[3,'Up to 3 jobs'],[4,'Up to 4 jobs']])+field('limits.retries','Maximum automatic retries','Existing stricter repair and workspace protections still apply.',[[0,'No automatic retries'],[1,'1 retry'],[2,'Up to 2 retries'],[3,'Up to 3 retries']])+field('limits.project_dollars','Reported spending checkpoint (USD)','Pause before the next job after a project reaches this reported amount. An in-flight job can exceed it.',null,'number')+hint('Cost availability differs by runner and assistant. Unknown cost is shown as unavailable; it is never treated as zero. Blog Studio cannot currently promise a dollar checkpoint.'),'Global policy')+section('What happens when a limit changes','Keep running work predictable.',`<p class="caption" style="line-height:1.9">Tighter limits apply at the next safe job boundary. Raising a limit does not automatically expand an active project’s saved authorization. Completed work and approvals stay in place.</p>`);scope=prior;return html;}
function connectionsPage(){const cards=[['connections','Git','Your Git identity and existing sign-in','Detected · Sample'],['models','Assistant','Codex or Claude Code · models discovered through the CLI','Detected · Sample'],['workspace','Google document access','Existing gcloud or connector access, checked per operation','Not checked'],['presentation','Local slide previews','LibreOffice and image tools · optional','Not checked'],['general','Harness Research','Research engine supplied with the platform bundle','Bundled · Sample'],['presentation','Harness Slides','Slide engine and production dependencies','Bundled · Sample'],['brand','Generated artwork','Optional provider and image model · separate from Google delivery','Off']];return section('Your tools, together','Check capabilities here. Credentials stay with their existing tools and services.',cards.map(([drawing,title,detail,status])=>`<div class="readiness"><span class="connection-icon">${icon(drawing)}</span><div class="connection-copy"><h3>${title}</h3><p>${detail}</p></div><span class="pill">${status}</span><button class="quiet-button" data-connection="${title}">Details</button></div>`).join('')+hint('All statuses in this design preview are illustrative. Buttons do not start sign-in, connect an account, install software or make provider requests.'));}
function updatesPage(){return section('Stay up to date','Checking for updates and installing updates are separate choices.',field('preferences.look_for_updates','Look for releases','Where supported, check for newer software without installing it.',null,'toggle'))+section('Installed tools','Version information is shown centrally. Installation always needs an explicit action.',[['Marketing Studio','4.1.0'],['Harness Research','0.8.1'],['Harness Slides','0.14.1']].map(([name,version])=>`<div class="readiness"><span class="connection-icon">${icon('updates')}</span><div class="connection-copy"><h3>${name}</h3><p>Illustrative bundle version</p></div><span class="pill">${version}</span></div>`).join('')+`<button class="secondary" data-action="update-details" style="margin-top:17px">Review update options</button>`);}
function writingDefaults(){return section('Blog Studio defaults','Useful starting choices. Each blog still confirms its sources, voice and stop point.',field('writing.tone','Writing style','A default direction, separate from a selected author voice profile.',null,'textarea')+field('writing.stop','Stop after','Keep native review and approval checkpoints.',[['outline','Outline'],['draft','Draft'],['review','Review'],['package','Publication handoff']])+field('writing.research','Source preference','A starting suggestion; public research still needs the work’s own permission.',[['none','No research'],['supplied-only','Supplied sources'],['web-allowed','Ask to use public sources']])+field('writing.analysis','Analyze imported references','Disclose the selected assistant before sending readable document text. Per-import opt-out remains available.',null,'toggle'));}
function homePage(){return `<div class="eyeline"><span class="status-dot"></span>One setup. Three independent studios.</div><div class="heading"><div><h1>What will you make?</h1><p>Your tools are ready for the way you work. Open a studio and start creating.</p></div></div><div class="studio-grid">${[['blog','Turn an idea into a blog in your voice.'],['presentation','Shape research into a presentation.'],['training','Build learning that takes people further.']].map(([id,description])=>`<article class="panel studio ${id}"><div class="studio-symbol">${icon(id)}</div><h2>${names[id]}</h2><p>${description}</p><div class="card-bottom"><span class="caption">${Object.keys(overrides[id]).length?'Custom defaults':'Uses shared defaults'}</span><button class="primary" data-launch="${id}">Open studio</button></div></article>`).join('')}</div><section class="panel"><div class="home-summary"><div><h2>Set up once. Make it your own.</h2><p>Shared defaults keep your tools together. A studio can customize a choice; your global limits stay in charge.</p></div><button class="secondary" data-go="models">Shared settings</button></div><div class="home-facts"><div><p>Assistant</p><strong>${globalValues['assistant.agent']==='codex'?'Codex':'Claude Code'} · ${globalValues['models.mode']==='by_task'?'By task':'One model'}</strong></div><div><p>Workspace</p><strong>${globalValues.storage==='local'?'Local Git · '+esc(globalValues['local.root']):'Shared repository'}</strong></div><div><p>Global limits</p><strong>${globalValues['limits.step_seconds']/60} min/job · ${globalValues['limits.parallel']} simultaneous</strong></div></div></section><p class="caption">This is an interactive design preview. The studios and settings shown here are sample data.</p>`;}
function render(){document.querySelector('#logo').innerHTML=icon('models');document.querySelector('#theme').innerHTML=icon('moon');document.querySelector('#navigation').innerHTML=Object.entries(titles).map(([id,title],index)=>`${index===1?'<span class="nav-group">Settings</span>':''}<button data-go="${id}" ${page===id?'aria-current="page"':''}>${icon(id)}${title}</button>`).join('');document.querySelector('#breadcrumb').textContent='/ '+titles[page];if(page==='home'){main.innerHTML=homePage();bind();return;}const desc={general:'The essentials that carry across your studios.',models:'A model for each kind of work. Shared wherever you create.',workspace:'Local first, with room to work together.',brand:'A consistent look, from the first draft to the final deck.',limits:'One place to keep the pace, time and spending in balance.',connections:'See what is ready, and set up only what you need.',updates:'Your studios and their shared tools, in one place.'};let body=({general:generalPage,models:modelsPage,workspace:workspacePage,brand:brandPage,limits:limitsPage,connections:connectionsPage,updates:updatesPage})[page]();if(scope==='blog'&&page==='general')body+=writingDefaults();if(scope==='training'&&page==='general')body+=section('Training Studio','Topic, audience, learning levels and practice outputs are selected when you start a training.',`<p class="caption">The shared model, brand and delivery defaults arrive already selected. Research permissions and deliverables remain reviewable for each training.</p>`);const noScope=firstRun||['limits','connections'].includes(page);main.innerHTML=`${firstRun?`<div class="eyeline">Step ${setupIndex+1} of 3 · First-time setup</div><ol class="setup-steps">${['You and your assistant','Workspace','Brand and delivery'].map((s,i)=>`<li class="${setupIndex===i?'active':''}">${s}</li>`).join('')}</ol>`:''}<div class="heading"><div><h1>${firstRun?['Make yourself at home.','A home for your work.','Your look. Your delivery.'][setupIndex]:titles[page]}</h1><p>${firstRun?'These choices will be ready in every studio.':desc[page]}</p></div><span class="pill ${page==='limits'?'blue':''}">${page==='limits'?'Applies to all studios':'Shared settings'}</span></div>${noScope?'':scopes()}${body}${page==='connections'?'':savebar()}`;bind();}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,5000);}
function change(key,value){if(page==='limits'||scope==='shared')globalValues[key]=value;else overrides[scope][key]=value;dirty=true;}
function go(next){if(dirty){modal('Keep your preview changes?','You have unsaved demo changes. Save them in this tab before moving on, or discard them.',()=>{saved={globalValues:structuredClone(globalValues),overrides:structuredClone(overrides)};dirty=false;page=next;render();window.scrollTo(0,0);},'Save and continue',()=>{globalValues=structuredClone(saved.globalValues);overrides=structuredClone(saved.overrides);dirty=false;page=next;render();window.scrollTo(0,0);},'Discard');return;}page=next;render();window.scrollTo(0,0);}
function modal(title,text,yes,label='Got it',no=null,noLabel='Cancel'){const shade=document.querySelector('#modal-shade');const previous=document.activeElement;shade.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><h2 id="modal-title">${esc(title)}</h2><p>${esc(text)}</p><div>${no?`<button class="secondary" id="modal-no">${noLabel}</button>`:''}<button class="primary" id="modal-yes">${label}</button></div></section>`;shade.hidden=false;const close=()=>{shade.hidden=true;shade.replaceChildren();previous?.focus();};shade.querySelector('#modal-yes').onclick=()=>{close();yes?.();};if(no)shade.querySelector('#modal-no').onclick=()=>{close();no();};shade.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const buttons=Array.from(shade.querySelectorAll('button'));const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}};shade.querySelector('button').focus();}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));main.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;render();});main.querySelectorAll('[data-field]').forEach(el=>el.addEventListener(el.tagName==='SELECT'||el.type==='checkbox'?'change':'input',()=>{const value=el.type==='checkbox'?el.checked:el.type==='number'||el.dataset.field.startsWith('limits.')?Number(el.value):el.value;if(el.type==='number'&&(!Number.isFinite(value)||value<1)){toast('Choose a positive sample amount.');return;}change(el.dataset.field,value);if(el.dataset.field==='storage'){render();}else{const p=main.querySelector('.savebar p');if(p)p.textContent='You have changes to preview.';}}));main.querySelectorAll('[data-override]').forEach(b=>b.onclick=()=>{const key=b.dataset.override;if(Object.hasOwn(overrides[scope],key))delete overrides[scope][key];else overrides[scope][key]=globalValues[key];dirty=true;render();});main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{change('models.mode',b.dataset.mode);render();});main.querySelectorAll('[data-connection]').forEach(b=>b.onclick=()=>modal(b.dataset.connection,'This preview shows where setup and availability will live. The finished interface will call the existing native checker or an explicit setup action. This demo makes no account, network or provider requests.'));main.querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>{toast(names[b.dataset.launch]+' would open with its effective settings. This preview does not launch an application.');});main.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{switch(b.dataset.action){case 'save':saved={globalValues:structuredClone(globalValues),overrides:structuredClone(overrides)};dirty=false;render();toast('Preview saved in this tab. No installed settings changed.');break;case 'discard':globalValues=structuredClone(saved.globalValues);overrides=structuredClone(saved.overrides);dirty=false;render();break;case 'update-details':modal('Updates stay deliberate','The finished interface will show verified suite and companion versions, then offer explicit install, update and rollback actions. This preview does not download or install anything.');break;case 'setup-back':if(setupIndex){setupIndex--;page=['general','workspace','brand'][setupIndex];}else{firstRun=false;page='home';}render();window.scrollTo(0,0);break;case 'setup-next':if(setupIndex<2){setupIndex++;page=['general','workspace','brand'][setupIndex];}else{firstRun=false;page='home';dirty=false;saved={globalValues:structuredClone(globalValues),overrides:structuredClone(overrides)};toast('First-time setup preview complete. No real workspace was created.');}render();window.scrollTo(0,0);}});}
document.querySelector('#theme').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';};document.querySelector('#first-run').onclick=()=>{firstRun=true;scope='shared';setupIndex=0;page='general';render();window.scrollTo(0,0);};if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.body.dataset.theme='dark';render();
</script>
</body></html>
