<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>Marketing Studio · Settings design preview</title>
<link rel="stylesheet" href="../../ui-kit/style.css">
<style>
/* What only this preview has. The tokens, the shell and every control come from
   ui-kit/style.css; these rules place the preview's own parts and draw nothing shared. */
.nav-list{display:contents}
.nav-group{padding:.9rem .75rem .3rem;color:var(--quiet);font-size:.75rem;font-weight:650;letter-spacing:.03em}
.preview-foot{margin-top:auto;padding:1.4rem .75rem 0;color:var(--quiet);font-size:.85rem;line-height:1.6}
.preview-foot>*+*{margin-top:.45rem}
.preview-foot .bead{width:.75rem;height:.75rem}
.preview-narrow{display:none}
.avatar{display:grid;place-items:center;width:2rem;height:2rem;background:var(--selection);color:var(--link);border-radius:50%;font-size:.75rem;font-weight:650}
.preview-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:1.25rem}
.preview-heading>.tag{margin-top:1rem}
.intro .bead{width:.75rem;height:.75rem}
.page>.workflow-steps{margin-top:.6rem}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.section-head .quiet{max-width:65ch;margin-top:.3rem}
.section-body>.field+*{margin-top:1.2rem}
.section-body>*+:is(.callout,.bar){margin-top:1rem}
.option-row{display:grid;grid-template-columns:minmax(12rem,1fr) minmax(12rem,19rem);gap:1.75rem;align-items:start;padding:1.1rem 0;border-top:1px solid var(--hair)}
.option-row:first-child{padding-top:0;border-top:0}
.option-text>*+*{margin-top:.3rem}
.option-text>.field-hint{max-width:49ch}
.toggle{display:flex;justify-content:flex-end}
.toggle:has(input:disabled){opacity:.55}
.source{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.85rem}
.origin{display:flex;align-items:center;gap:.3rem}
.preview-hint{display:flex;align-items:flex-start;gap:.6rem}
.preview-hint>.icon{margin-top:.15em}
.segmented[data-count="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.segmented[data-count="4"]>.seg-thumb{width:calc((100% - 6px) / 4)}
.segmented[data-count="4"][data-at="3"]>.seg-thumb{transform:translateX(300%)}
.assistant-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25rem}
.assistant-grid .option-row{display:flex;flex-direction:column;align-items:stretch;gap:.75rem;padding:0;border:0}
.assistant-grid .option-text{flex:1}
.profile-head,.profile-row{display:grid;grid-template-columns:minmax(12rem,1fr) minmax(10rem,14.5rem) minmax(7rem,8.5rem);gap:.9rem}
.profile-head{padding-bottom:.8rem;font-size:.82rem}
.profile-row{align-items:start;padding:1.1rem 0;border-top:1px solid var(--hair)}
.profile-row>div:first-child>*+*{margin-top:.3rem}
.profile-row .field-hint{max-width:34ch}
.profile-title{display:flex;align-items:center;gap:.55rem}
.blank-state{padding:1.25rem 0}
.details{margin-top:.4rem;padding-top:1rem;border-top:1px solid var(--hair)}
.more-label{display:list-item;min-height:2.75rem;font-weight:600}
.connection-icon{display:grid;place-items:center;flex:none;width:2.4rem;height:2.4rem;background:var(--well);color:var(--link);border-radius:10px}
.studio-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem}
.studio-card{display:flex;flex-direction:column;align-items:flex-start;min-height:18rem}
.studio-icon{display:grid;place-items:center;width:3.1rem;height:3.1rem;background:var(--studio-wash);color:var(--studio-color);border-radius:15px}
.studio-icon>.icon{width:1.6rem;height:1.6rem}
.studio-name{padding-top:.6rem;font-size:1.3rem;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.studio-says{color:var(--quiet);font-size:.93rem}
.studio-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem;width:100%;margin-top:auto;padding-top:.6rem}
.studio-note{font-size:.82rem}
.home-summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem 1.5rem}
.home-summary>div{flex:1 1 20rem;min-width:0}
.home-summary .quiet{margin-top:.3rem}
.home-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25rem}
.home-facts>div{padding-left:1.1rem;border-left:1px solid var(--hair)}
.home-facts>div:first-child{padding-left:0;border-left:0}
.home-facts .quiet{margin-bottom:.3rem;font-size:.85rem}
.home-facts strong{font-weight:560;overflow-wrap:anywhere}
.savebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;padding-top:1.25rem;border-top:1px solid var(--hair)}
.savebar>.quiet{flex:1 1 18rem;font-size:.88rem}
.modal-shade{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:1.5rem;background:var(--scrim)}
.modal-shade>.dialog{width:min(28rem,100%)}
.dialog-content>.bar{justify-content:flex-end}
@media(max-width:70rem){
.option-row{grid-template-columns:minmax(0,1fr) minmax(0,15rem);gap:1.25rem}
.profile-head,.profile-row{grid-template-columns:1.1fr 1fr .65fr;gap:.75rem}
.studio-list{grid-template-columns:1fr}
.studio-card{display:grid;grid-template-columns:3.1rem minmax(0,1fr) auto;align-items:center;gap:.25rem 1.2rem;min-height:0}
.studio-card>*+*{margin-top:0}
.studio-icon{grid-row:1/4}
.studio-name,.studio-says{grid-column:2;padding:0}
.studio-foot{flex-direction:column;align-items:flex-end;grid-column:3;grid-row:1/4;width:auto;margin:0;padding:0}
}
@media(max-width:60rem){
.assistant-grid{grid-template-columns:1fr}
.profile-head{display:none}
.profile-row{grid-template-columns:1fr 1fr}
.profile-row>div:first-child{grid-column:1/-1}
}
@media(max-width:52rem){
.nav-group,.preview-foot,.preview-heading>.tag{display:none}
.sidebar{overflow-x:auto}
.nav-item{flex:1 0 5rem}
.preview-narrow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.option-row{grid-template-columns:1fr;gap:.75rem}
.toggle{justify-content:flex-start}
.home-facts{grid-template-columns:1fr;gap:.9rem}
.home-facts>div{padding-left:0;border-left:0}
}
@media(max-width:40rem){
.studio-card{grid-template-columns:2.5rem minmax(0,1fr)}
.studio-icon{width:2.5rem;height:2.5rem;border-radius:11px}
.studio-foot{flex-direction:row;align-items:center;grid-column:1/-1;grid-row:auto;width:100%;margin-top:.6rem}
.savebar>.bar{justify-content:flex-end;width:100%}
}
</style>
</head>
<body data-product="Marketing Studio">
<a href="#main" class="skip">Skip to settings</a><div class="backdrop" aria-hidden="true"></div>
<div class="window"><nav class="sidebar glass" aria-label="Marketing Studio"><p class="brand"><span class="studio-symbol" aria-hidden="true">M</span><span>Marketing Studio</span></p><div class="nav-list" id="navigation"></div><div class="preview-foot"><p class="state"><span class="bead" aria-hidden="true"></span><span>Design preview</span></p><p>Sample settings only.<br>Changes stay in this tab.</p><button type="button" class="link" id="first-run" data-first-run>Preview first-time setup</button></div></nav><div class="content"><div class="toolbar-wrap"><header class="toolbar glass"><div class="toolbar-title"><p class="above">Marketing Studio</p><p class="title" id="breadcrumb">Shared settings</p></div><div class="toolbar-actions"><span class="preview-narrow"><span class="tag">Design preview</span><button type="button" class="button button-quiet" data-first-run>Preview first-time setup</button></span><button type="button" class="button button-quiet button-round" id="theme" aria-label="Toggle preview dark mode"></button><span class="avatar" role="img" aria-label="Sample user">AM</span></div></header></div><main class="page" id="main" tabindex="-1"></main></div></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div><div class="modal-shade" id="modal-shade" hidden></div>
<script>
'use strict';
const paths={home:'M3 11 12 3l9 8M5 10v11h5v-7h4v7h5V10',general:'M20 21v-2a7 7 0 0 0-14 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',models:'m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3z',workspace:'M3 7h7l2 3h9v10H3zM3 7V4h7l2 3',brand:'M12 3a9 9 0 1 0 0 18h2a2 2 0 0 0 0-4 2 2 0 0 1 0-4h3a4 4 0 0 0 4-4c0-3-4-6-9-6M7 9h.01M10 6h.01M16 7h.01M6 14h.01',limits:'M12 3v4M3 12h4M17 12h4M12 17v4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',connections:'M9 15 6 18a4 4 0 0 1-5-5l4-4a4 4 0 0 1 5 0M15 9l3-3a4 4 0 0 1 5 5l-4 4a4 4 0 0 1-5 0M8 16l8-8',updates:'M20 9a8 8 0 1 0 0 6M20 3v6h-6',blog:'M5 3h9l5 5v13H5zM14 3v6h5M8 13h8M8 17h6',presentation:'M3 4h18v13H3zM12 17v5M7 22h10M7 12l3-3 4 2 3-5',training:'m2 8 10-5 10 5-10 5zM6 11v7c4 3 8 3 12 0v-7M22 8v10',link:'M9 15 6 18a4 4 0 0 1-5-5l4-4a4 4 0 0 1 5 0M15 9l3-3a4 4 0 0 1 5 5l-4 4a4 4 0 0 1-5 0M8 16l8-8',moon:'M20 14A9 9 0 0 1 10 4a9 9 0 1 0 10 10',check:'m5 12 4 4L19 6',info:'M12 8h.01M12 11v6M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18',quick:'m13 2-9 12h7l-1 8 10-12h-7z',complex:'m12 3 8 5v8l-8 5-8-5V8zM4 8l8 5 8-5M12 13v8',arrow:'M5 12h14M14 7l5 5-5 5'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.general}"/></svg>`;}
const titles={home:'Studios',general:'General',models:'Models',workspace:'Workspace',brand:'Brand and delivery',limits:'Global limits',connections:'Connections',updates:'Updates'};
const names={shared:'Shared defaults',blog:'Blog Studio',presentation:'Presentation Studio',training:'Training Studio'};
const initial={'person.name':'Alex Morgan','assistant.agent':'codex','assistant.model':'default','assistant.effort':'medium','models.mode':'by_task','models.quick.model':'sample-fast','models.quick.effort':'low','models.main.model':'sample-balanced','models.main.effort':'medium','models.complex.model':'sample-deep','models.complex.effort':'high','storage':'local','local.root':'~/Studios','team.repository':'https://github.com/example/studio-work.git','team.branch':'main','share':'decision','brand.repository':'https://github.com/example/brand-skill','brand.brand':'northstar','brand.variant':'light','brand.release':'','brand.skill':'','output':'pptx','render.previews':'','limits.step_seconds':600,'limits.parallel':2,'limits.retries':2,'limits.project_dollars':20,'preferences.notify':false,'preferences.look_for_updates':true,'writing.tone':'Clear, conversational and specific','writing.stop':'package','writing.research':'supplied-only','writing.analysis':true};
let globalValues={...initial},overrides={blog:{},presentation:{},training:{}},saved={globalValues:structuredClone(globalValues),overrides:structuredClone(overrides)},page='models',scope='shared',dirty=false,firstRun=false,setupIndex=0;
const main=document.querySelector('#main');const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function effective(key){return scope!=='shared'&&Object.hasOwn(overrides[scope],key)?overrides[scope][key]:globalValues[key];}
function editable(key){return scope==='shared'||(scope==='blog'&&key.startsWith('writing.'))||Object.hasOwn(overrides[scope],key);}
function source(key,label=key){if(scope==='blog'&&key.startsWith('writing.'))return '<span class="source quiet"><span>For new blogs in Blog Studio</span></span>';if(scope==='shared')return '';const custom=Object.hasOwn(overrides[scope],key);return `<span class="source quiet"><span class="origin">${icon(custom?'general':'link')}${custom?'Custom for this studio':'From shared defaults'}</span><button type="button" class="link" data-override="${key}" aria-label="${custom?'Use shared':'Customize'} ${esc(label)} for ${names[scope]}">${custom?'Use shared':'Customize'}</button></span>`;}
function fieldId(key){return 'field-'+key.replace(/\./g,'-');}
function field(key,label,help,options,kind='select') {const value=effective(key);const disabled=editable(key)?'':'disabled';const id=fieldId(key);const described=`aria-describedby="${id}-hint"`;let control;if(kind==='toggle')control=`<div class="toggle"><div class="segmented" data-count="2" data-at="${value?1:0}" role="radiogroup" aria-labelledby="${id}-label"><span class="seg-thumb" aria-hidden="true"></span>${[[false,'Off'],[true,'On']].map(([choice,word])=>`<label class="seg-option"><input type="radio" name="${key}" value="${choice}" data-field="${key}" ${described} ${Boolean(value)===choice?'checked':''} ${disabled}>${word}</label>`).join('')}</div></div>`;else if(kind==='textarea')control=`<textarea class="input" id="${id}" data-field="${key}" ${described} ${disabled}>${esc(value)}</textarea>`;else if(kind==='input'||kind==='number')control=`<input class="input" id="${id}" type="${kind==='number'?'number':'text'}" ${kind==='number'?'min="1" max="10000"':''} data-field="${key}" ${described} value="${esc(value)}" ${disabled}>`;else control=`<select class="input" id="${id}" data-field="${key}" ${described} ${disabled}>${options.map(option=>{let [v,l]=Array.isArray(option)?option:[option,option];return `<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`;const name=kind==='toggle'?`<p class="field-label" id="${id}-label">${label}</p>`:`<label class="field-label" for="${id}">${label}</label>`;return `<div class="option-row"><div class="option-text">${name}<p class="field-hint quiet" id="${id}-hint">${help}</p></div><div class="field">${control}${source(key,label)}</div></div>`;}
function section(title,description,body,badge=''){return `<section class="card"><div class="section-head"><div><h2 class="card-title">${title}</h2><p class="quiet">${description}</p></div>${badge?`<span class="tag">${badge}</span>`:''}</div><div class="section-body">${body}</div></section>`;}
function hint(text){return `<div class="paper callout"><p class="quiet preview-hint">${icon('info')}<span>${text}</span></p></div>`;}
function savebar(){return `<footer class="savebar"><p class="quiet">${firstRun?'You can change these choices later.':dirty?'You have changes to preview.':page==='limits'?'One global policy. Tighter limits apply before the next job.':'New work starts with these choices. Existing work keeps its settings.'}</p><div class="bar">${firstRun?`<button type="button" class="button" data-action="setup-back">${setupIndex?'Back':'Leave setup'}</button><button type="button" class="button button-filled" data-action="setup-next">${setupIndex===2?'Finish setup':'Continue'}</button>`:`<button type="button" class="button" data-action="discard">Revert</button><button type="button" class="button button-filled" data-action="save">${scope==='shared'||page==='limits'?'Save shared defaults':'Save for '+names[scope]}</button>`}</div></footer>`;}
function scopes(){return `<div class="field"><div class="segmented" data-count="4" data-at="${Object.keys(names).indexOf(scope)}" role="group" aria-label="Settings scope"><span class="seg-thumb" aria-hidden="true"></span>${Object.entries(names).map(([key,name])=>`<button type="button" class="seg-option" data-scope="${key}" aria-pressed="${scope===key}">${name}</button>`).join('')}</div>${scope==='shared'?'':`<p class="field-hint quiet">${names[scope]} follows shared defaults. Customize only what you want to be different. Global limits always apply.</p>`}</div>`;}
const models=[['default','Assistant’s default'],['sample-fast','Sample · Fast'],['sample-balanced','Sample · Balanced'],['sample-deep','Sample · Deep']];
const effortOptions=[['','Assistant’s default'],['low','Low'],['medium','Medium'],['high','High']];
function modelField(key,label,opts){opts=[['inherit',key.endsWith('.effort')?'Inherit default reasoning':'Inherit default model'],...opts];const value=effective(key);return `<div class="field"><select class="input" data-field="${key}" aria-label="${label}" ${editable(key)?'':'disabled'}>${opts.map(([v,l])=>`<option value="${v}" ${String(value)===v?'selected':''}>${l}</option>`).join('')}</select>${source(key,label)}</div>`;}
function modelsPage(){const mode=effective('models.mode');const locked=editable('models.mode')?'':'disabled';return section('Your assistant','Use the assistant you already sign in to. No extra account or API key.','<div class="assistant-grid">'+field('assistant.agent','Assistant','Your existing CLI sign-in.',[['codex','Codex'],['claude','Claude Code']])+field('assistant.model','Default model','Fallback for inherited profiles.',models)+field('assistant.effort','Default reasoning','Used with the default model.',effortOptions)+'</div>',scope==='shared'?'All studios':names[scope])+section('Choose the right model for the work','Start simple, or give different kinds of work their own model and reasoning level.',`<div class="field"><div class="segmented" data-count="2" data-at="${mode==='by_task'?1:0}" role="group" aria-label="Model routing"><span class="seg-thumb" aria-hidden="true"></span><button type="button" class="seg-option" data-mode="single" aria-pressed="${mode==='single'}" ${locked}>One model</button><button type="button" class="seg-option" data-mode="by_task" aria-pressed="${mode==='by_task'}" ${locked}>By task</button></div>${source('models.mode','Model routing')}</div>${mode==='by_task'?`<div><div class="profile-head quiet"><span>Kind of work</span><span>Model</span><span>Reasoning</span></div>${[['quick','Quick work','Extracting facts, organizing sources and small changes.','quick'],['main','Main work','Research, writing, teaching design and building slides.','models'],['complex','Complex work','Difficult evidence, technical diagrams and focused repairs.','complex']].map(([key,name,description,drawing])=>`<div class="profile-row"><div><h3 class="sheet-part profile-title">${icon(drawing)}${name}</h3><p class="field-hint quiet">${description}</p></div>${modelField('models.'+key+'.model',name+' model',models)}${modelField('models.'+key+'.effort',name+' reasoning',effortOptions)}</div>`).join('')}</div>`:`<div class="blank-state"><p class="quiet">Every assistant job uses your default model and reasoning.</p></div>`}${hint('This preview uses sample model names. The real interface will list models available to your selected assistant. No account has been queried.')}`,'Automatic routing');}
function generalPage(){return section('You and your studios','A few familiar choices, shared wherever you start.',field('person.name','Your name','Used as a starting author name. Git commit identity is configured separately.',null,'input')+(firstRun?field('assistant.agent','Assistant','Choose the assistant you already sign in to.',[['codex','Codex'],['claude','Claude Code']]):scope==='blog'?'<div class="paper callout quiet">Desktop notifications are not currently supported by Blog Studio. The shared preference remains available to the other studios.</div>':field('preferences.notify','Let me know when I’m needed','Desktop notifications in Presentation Studio and Training Studio, where this computer supports them.',null,'toggle')))+section('Assistant and models','Use one model everywhere, or set up Quick, Main and Complex profiles.',`<div class="row"><span class="connection-icon">${icon('models')}</span><div class="row-text"><h3 class="row-title">${effective('assistant.agent')==='codex'?'Codex':'Claude Code'}</h3><p class="row-says">${effective('models.mode')==='by_task'?'Models chosen by task':'One model for all work'} · ${scope==='shared'?'Shared with all three studios':'Effective for '+names[scope]}</p></div><button type="button" class="button" data-go="models">Configure models</button></div>`);}
function workspacePage(){return section('A place for your work','Keep local Git history, or use an existing repository to work with a team.',field('storage','Storage','Both choices keep Git history. A remote repository is optional.',[['local','Local Git on this computer'],['remote','Shared repository']])+(effective('storage')==='local'?field('local.root','Work folder','Each studio gets its own repository inside this folder.',null,'input'):field('team.repository','Repository','Use an existing repository address without credentials.',null,'input')+field('team.branch','Branch','The starting branch for new studio workspaces.',null,'input')+field('share','Share changes','Choose when approved changes are pushed.',[['decision','After each decision'],['asked','When I ask']]))+hint('Existing studio workspaces stay where they are. Changing these defaults never moves your content or reconnects a repository.'))+section('Current workspaces','The real interface shows each native workspace and offers an explicit change action.',`<div class="home-facts">${['blog','presentation','training'].map(id=>`<div><p class="quiet">${names[id]}</p><strong>~/Studios/${id}-workspace</strong></div>`).join('')}</div>`,'Sample locations');}
function brandPage(){return section('Your brand library','The skill supplies templates and guidelines. The default brand selects a look inside it.',field('brand.repository','Brand skill repository','Installed and updated only when you choose an explicit installation action.',null,'input')+field('brand.brand','Default brand','New work starts with this brand. Choose another for individual work.',[['northstar','Northstar · Sample brand'],['neutral','Studio neutral · Sample brand']])+field('brand.variant','Default appearance','Choose a variant offered by the selected brand.',[['light','Light'],['dark','Dark']])+`<details class="details"><summary class="more-label">Installation options</summary>${field('brand.skill','Installed skill folder','Normally found automatically. Set a folder when you have several brand skills.',null,'input')}${field('brand.release','Release tag','Leave blank for the latest release.',null,'input')}</details>`)+section('Delivery and previews','Use the right format for your team, with local files always available.',field('output','Deliver as','Applied to the document and deck formats each studio supports.',[['pptx','PowerPoint and Word files'],['google','Google Slides and Docs']])+(scope==='blog'?'<div class="paper callout quiet">Slide previews are not used by Blog Studio. Your shared preview choice applies to Presentation Studio and Training Studio.</div>':field('render.previews','Slide previews','Used by Presentation Studio and Training Studio.',[['','Match delivery format'],['local','Local · LibreOffice'],['drive','Google Drive']]))+hint('Google delivery and artwork generation are separate capabilities. Saving these choices does not sign in, install tools or generate content.'));}
function limitsPage(){const prior=scope;scope='shared';const html=section('One policy for all studios','Set limits here once. There are no separate studio limit settings or overrides.',field('limits.step_seconds','Maximum time per assistant job','Time spent waiting for a slot does not count toward job duration.',[[300,'5 minutes'],[600,'10 minutes'],[900,'15 minutes'],[1800,'30 minutes'],[3600,'60 minutes']])+field('limits.parallel','Simultaneous assistant jobs','A single total across independently running studios on this computer.',[[1,'1 job at a time'],[2,'Up to 2 jobs'],[3,'Up to 3 jobs'],[4,'Up to 4 jobs']])+field('limits.retries','Maximum automatic retries','Existing stricter repair and workspace protections still apply.',[[0,'No automatic retries'],[1,'1 retry'],[2,'Up to 2 retries'],[3,'Up to 3 retries']])+field('limits.project_dollars','Reported spending checkpoint (USD)','Pause before the next job after a project reaches this reported amount. An in-flight job can exceed it.',null,'number')+hint('Cost availability differs by runner and assistant. Unknown cost is shown as unavailable; it is never treated as zero. Blog Studio cannot currently promise a dollar checkpoint.'),'Global policy')+section('What happens when a limit changes','Keep running work predictable.',`<p class="quiet">Tighter limits apply at the next safe job boundary. Raising a limit does not automatically expand an active project’s saved authorization. Completed work and approvals stay in place.</p>`);scope=prior;return html;}
function connectionsPage(){const cards=[['connections','Git','Your Git identity and existing sign-in','Detected · Sample'],['models','Assistant','Codex or Claude Code · models discovered through the CLI','Detected · Sample'],['workspace','Google document access','Existing gcloud or connector access, checked per operation','Not checked'],['presentation','Local slide previews','LibreOffice and image tools · optional','Not checked'],['general','Harness Research','Research engine supplied with the platform bundle','Bundled · Sample'],['presentation','Harness Slides','Slide engine and production dependencies','Bundled · Sample'],['brand','Generated artwork','Optional provider and image model · separate from Google delivery','Off']];return section('Your tools, together','Check capabilities here. Credentials stay with their existing tools and services.',cards.map(([drawing,title,detail,status])=>`<div class="row"><span class="connection-icon">${icon(drawing)}</span><div class="row-text"><h3 class="row-title">${title}</h3><p class="row-says">${detail}</p></div><span class="tag">${status}</span><button type="button" class="button button-quiet" data-connection="${title}">Details</button></div>`).join('')+hint('All statuses in this design preview are illustrative. Buttons do not start sign-in, connect an account, install software or make provider requests.'));}
function updatesPage(){return section('Stay up to date','Checking for updates and installing updates are separate choices.',field('preferences.look_for_updates','Look for releases','Where supported, check for newer software without installing it.',null,'toggle'))+section('Installed tools','Version information is shown centrally. Installation always needs an explicit action.',[['Marketing Studio','4.1.0'],['Harness Research','0.8.1'],['Harness Slides','0.14.1']].map(([name,version])=>`<div class="row"><span class="connection-icon">${icon('updates')}</span><div class="row-text"><h3 class="row-title">${name}</h3><p class="row-says">Illustrative bundle version</p></div><span class="tag">${version}</span></div>`).join('')+`<div class="bar"><button type="button" class="button" data-action="update-details">Review update options</button></div>`);}
function writingDefaults(){return section('Blog Studio defaults','Useful starting choices. Each blog still confirms its sources, voice and stop point.',field('writing.tone','Writing style','A default direction, separate from a selected author voice profile.',null,'textarea')+field('writing.stop','Stop after','Keep native review and approval checkpoints.',[['outline','Outline'],['draft','Draft'],['review','Review'],['package','Publication handoff']])+field('writing.research','Source preference','A starting suggestion; public research still needs the work’s own permission.',[['none','No research'],['supplied-only','Supplied sources'],['web-allowed','Ask to use public sources']])+field('writing.analysis','Analyze imported references','Disclose the selected assistant before sending readable document text. Per-import opt-out remains available.',null,'toggle'));}
function homePage(){return `<div class="intro"><p class="state quiet"><span class="bead" data-state="done" aria-hidden="true"></span>One setup. Three independent studios.</p><h1 class="large-title">What will you make?</h1><p class="lede">Your tools are ready for the way you work. Open a studio and start creating.</p></div><div class="studio-list">${[['blog','Turn an idea into a blog in your voice.'],['presentation','Shape research into a presentation.'],['training','Build learning that takes people further.']].map(([id,description])=>`<article class="card studio-card" data-studio="${id}"><div class="studio-icon" aria-hidden="true">${icon(id)}</div><h2 class="studio-name">${names[id]}</h2><p class="studio-says">${description}</p><div class="studio-foot"><span class="quiet studio-note">${Object.keys(overrides[id]).length?'Custom defaults':'Uses shared defaults'}</span><button type="button" class="button button-filled" data-launch="${id}">Open studio</button></div></article>`).join('')}</div><section class="card"><div class="home-summary"><div><h2 class="card-title">Set up once. Make it your own.</h2><p class="quiet">Shared defaults keep your tools together. A studio can customize a choice; your global limits stay in charge.</p></div><button type="button" class="button" data-go="models">Shared settings</button></div><div class="home-facts"><div><p class="quiet">Assistant</p><strong>${globalValues['assistant.agent']==='codex'?'Codex':'Claude Code'} · ${globalValues['models.mode']==='by_task'?'By task':'One model'}</strong></div><div><p class="quiet">Workspace</p><strong>${globalValues.storage==='local'?'Local Git · '+esc(globalValues['local.root']):'Shared repository'}</strong></div><div><p class="quiet">Global limits</p><strong>${globalValues['limits.step_seconds']/60} min/job · ${globalValues['limits.parallel']} simultaneous</strong></div></div></section><p class="foot">This is an interactive design preview. The studios and settings shown here are sample data.</p>`;}
function render(){document.querySelector('#navigation').innerHTML=Object.entries(titles).map(([id,title],index)=>`${index===1?'<span class="nav-group">Settings</span>':''}<button type="button" class="nav-item" data-go="${id}" ${page===id?'aria-current="page"':''}>${icon(id)}<span class="nav-label">${title}</span></button>`).join('');document.querySelector('#breadcrumb').textContent=titles[page];if(page==='home'){main.innerHTML=homePage();bind();return;}const desc={general:'The essentials that carry across your studios.',models:'A model for each kind of work. Shared wherever you create.',workspace:'Local first, with room to work together.',brand:'A consistent look, from the first draft to the final deck.',limits:'One place to keep the pace, time and spending in balance.',connections:'See what is ready, and set up only what you need.',updates:'Your studios and their shared tools, in one place.'};let body=({general:generalPage,models:modelsPage,workspace:workspacePage,brand:brandPage,limits:limitsPage,connections:connectionsPage,updates:updatesPage})[page]();if(scope==='blog'&&page==='general')body+=writingDefaults();if(scope==='training'&&page==='general')body+=section('Training Studio','Topic, audience, learning levels and practice outputs are selected when you start a training.',`<p class="quiet">The shared model, brand and delivery defaults arrive already selected. Research permissions and deliverables remain reviewable for each training.</p>`);const noScope=firstRun||['limits','connections'].includes(page);main.innerHTML=`${firstRun?`<p class="quiet">Step ${setupIndex+1} of 3 · First-time setup</p><ol class="workflow-steps" aria-label="Setup progress">${['You and your assistant','Workspace','Brand and delivery'].map((s,i)=>`<li class="workflow-step"${setupIndex===i?' aria-current="step"':''}>${s}</li>`).join('')}</ol>`:''}<div class="preview-heading"><div class="intro"><h1 class="large-title">${firstRun?['Make yourself at home.','A home for your work.','Your look. Your delivery.'][setupIndex]:titles[page]}</h1><p class="lede">${firstRun?'These choices will be ready in every studio.':desc[page]}</p></div><span class="tag">${page==='limits'?'Applies to all studios':'Shared settings'}</span></div>${noScope?'':scopes()}${body}${page==='connections'?'':savebar()}`;bind();}
function toast(message){const node=document.createElement('p');node.className='toast glass';node.textContent=message;document.querySelector('#toasts').append(node);setTimeout(()=>{node.classList.add('toast-leaving');setTimeout(()=>node.remove(),window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:260);},5000);}
function change(key,value){if(page==='limits'||scope==='shared')globalValues[key]=value;else overrides[scope][key]=value;dirty=true;}
function go(next){if(dirty){modal('Keep your preview changes?','You have unsaved demo changes. Save them in this tab before moving on, or discard them.',()=>{saved={globalValues:structuredClone(globalValues),overrides:structuredClone(overrides)};dirty=false;page=next;render();window.scrollTo(0,0);},'Save and continue',()=>{globalValues=structuredClone(saved.globalValues);overrides=structuredClone(saved.overrides);dirty=false;page=next;render();window.scrollTo(0,0);},'Discard');return;}page=next;render();window.scrollTo(0,0);}
function modal(title,text,yes,label='Got it',no=null,noLabel='Cancel'){const shade=document.querySelector('#modal-shade');const previous=document.activeElement;shade.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><header class="dialog-header"><h2 id="modal-title">${esc(title)}</h2></header><div class="dialog-content"><p class="quiet">${esc(text)}</p><div class="bar">${no?`<button type="button" class="button" id="modal-no">${noLabel}</button>`:''}<button type="button" class="button button-filled" id="modal-yes">${label}</button></div></div></section>`;shade.hidden=false;const close=()=>{shade.hidden=true;shade.replaceChildren();previous?.focus();};shade.querySelector('#modal-yes').onclick=()=>{close();yes?.();};if(no)shade.querySelector('#modal-no').onclick=()=>{close();no();};shade.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const buttons=Array.from(shade.querySelectorAll('button'));const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}};shade.querySelector('button').focus();}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));main.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;render();});main.querySelectorAll('[data-field]').forEach(el=>el.addEventListener(el.tagName==='SELECT'||el.type==='radio'?'change':'input',()=>{const value=el.type==='radio'?el.value==='true':el.type==='number'||el.dataset.field.startsWith('limits.')?Number(el.value):el.value;if(el.type==='number'&&(!Number.isFinite(value)||value<1)){toast('Choose a positive sample amount.');return;}if(el.type==='radio'){const group=el.closest('.segmented');group.dataset.at=String(Array.from(group.querySelectorAll('input')).indexOf(el));}change(el.dataset.field,value);if(el.dataset.field==='storage'){render();}else{const p=main.querySelector('.savebar p');if(p)p.textContent='You have changes to preview.';}}));main.querySelectorAll('[data-override]').forEach(b=>b.onclick=()=>{const key=b.dataset.override;if(Object.hasOwn(overrides[scope],key))delete overrides[scope][key];else overrides[scope][key]=globalValues[key];dirty=true;render();});main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{change('models.mode',b.dataset.mode);render();});main.querySelectorAll('[data-connection]').forEach(b=>b.onclick=()=>modal(b.dataset.connection,'This preview shows where setup and availability will live. The finished interface will call the existing native checker or an explicit setup action. This demo makes no account, network or provider requests.'));main.querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>{toast(names[b.dataset.launch]+' would open with its effective settings. This preview does not launch an application.');});main.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{switch(b.dataset.action){case 'save':saved={globalValues:structuredClone(globalValues),overrides:structuredClone(overrides)};dirty=false;render();toast('Preview saved in this tab. No installed settings changed.');break;case 'discard':globalValues=structuredClone(saved.globalValues);overrides=structuredClone(saved.overrides);dirty=false;render();break;case 'update-details':modal('Updates stay deliberate','The finished interface will show verified suite and companion versions, then offer explicit install, update and rollback actions. This preview does not download or install anything.');break;case 'setup-back':if(setupIndex){setupIndex--;page=['general','workspace','brand'][setupIndex];}else{firstRun=false;page='home';}render();window.scrollTo(0,0);break;case 'setup-next':if(setupIndex<2){setupIndex++;page=['general','workspace','brand'][setupIndex];}else{firstRun=false;page='home';dirty=false;saved={globalValues:structuredClone(globalValues),overrides:structuredClone(overrides)};toast('First-time setup preview complete. No real workspace was created.');}render();window.scrollTo(0,0);}});}
// The kit keeps its dark tokens under prefers-color-scheme. So this preview can switch appearance
// on its own, copy those tokens into two rules keyed on data-theme, placed just after the kit's
// own: its later rules (the system accent, reduced transparency, no blur) still win. A browser
// that keeps the kit's rules from this page (a file:// page in Chrome) follows the system, and
// the switch is hidden.
function themeRules(){for(const sheet of document.styleSheets){let rules;try{rules=Array.from(sheet.cssRules);}catch{continue;}const at=rules.findIndex(rule=>rule.media&&/prefers-color-scheme:\s*dark/.test(rule.media.mediaText));if(at<0)continue;const dark=Array.from(rules[at].cssRules).find(rule=>rule.selectorText===':root'),light=rules.slice(0,at).find(rule=>rule.selectorText===':root');if(!dark||!light)continue;const tokens=from=>Array.from(dark.style).map(name=>`${name}:${from.style.getPropertyValue(name)}`).join(';');sheet.insertRule(`:root:where([data-theme="light"]){color-scheme:light;${tokens(light)}}`,at+1);sheet.insertRule(`:root:where([data-theme="dark"]){color-scheme:dark;${tokens(dark)}}`,at+1);return true;}return false;}
const themeButton=document.querySelector('#theme');themeButton.innerHTML=icon('moon');themeButton.hidden=!themeRules();themeButton.onclick=()=>{const root=document.documentElement;const now=root.dataset.theme||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');root.dataset.theme=now==='dark'?'light':'dark';};document.querySelectorAll('[data-first-run]').forEach(button=>button.onclick=()=>{firstRun=true;scope='shared';setupIndex=0;page='general';render();window.scrollTo(0,0);});render();
</script>
</body></html>
