<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>Shared research · interactive design preview</title>
<link rel="stylesheet" href="../../ui-kit/style.css">
<style>
.preview-controls{display:flex;align-items:center;flex-wrap:wrap;gap:.65rem;padding:.75rem var(--gutter);border-bottom:1px solid var(--hair);background:var(--paper)}
.preview-controls>.quiet{margin-right:auto;font-size:.85rem}.preview-controls .input{width:auto}.research-preview{max-width:64rem;margin:auto}.research-main{max-width:49rem;margin:0 auto;padding:2.2rem var(--gutter) 4rem}.research-main>*+*{margin-top:1.5rem}.research-main .large-title{font-size:clamp(1.75rem,4vw,2.25rem);letter-spacing:-.035em}.research-main .lede{margin-top:.4rem}.research-intent{padding:1rem 0 0;border-top:1px solid var(--hair)}
.source-panel{padding:1.4rem;background:var(--paper);border:1px solid var(--paper-line);border-radius:var(--card-round)}.source-panel>*+*{margin-top:1.1rem}.source-heading{display:flex;align-items:center;justify-content:space-between;gap:1rem}.source-count{font-size:.85rem;color:var(--quiet)}.source-inputs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.7rem;align-items:end}.source-inputs textarea{min-height:5.4rem}.source-actions{display:flex;flex-wrap:wrap;gap:.55rem}.source-list{list-style:none;padding:0;margin-top:.3rem}.source-entry{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:.8rem;padding:1.1rem 0;border-top:1px solid var(--hair);align-items:start}.source-icon{display:grid;place-items:center;width:2.4rem;height:2.6rem;background:var(--selection);color:var(--link);border-radius:.6rem;font-size:.7rem;font-weight:650}.source-copy>*+*{margin-top:.25rem}.source-copy .quiet{font-size:.9rem;overflow-wrap:anywhere}.source-copy summary{min-height:2.75rem;display:flex;align-items:center;cursor:pointer;color:var(--link)}.source-copy details{margin-top:0}.source-copy details[open]>*+*{margin-top:.6rem}.source-remove{min-width:2.75rem;padding:.4rem}.source-copy .check{min-height:2.75rem}.source-tools{display:flex;gap:.7rem;flex-wrap:wrap}.source-warning{color:var(--yours)}.capture-content{padding:.85rem;background:var(--solid);border-radius:.65rem;font-size:.9rem}.source-policy{padding:.15rem .1rem}.source-policy>*+*{margin-top:.65rem}.source-policy .check{align-items:flex-start;gap:.7rem;line-height:1.5;min-height:2.75rem}.source-policy .check input{margin-top:.35rem}.source-policy .quiet{padding-left:2rem}.research-advanced{border-top:1px solid var(--hair);padding-top:1rem}.research-advanced>summary{min-height:2.75rem;cursor:pointer}.research-advanced[open]>*+*{margin-top:1rem}.research-footer{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:1rem;border-top:1px solid var(--hair)}.research-footer>.quiet{max-width:32rem;font-size:.9rem}.research-footer>.button{flex-shrink:0}.phase-list{list-style:none;padding:0;display:flex;gap:1rem;flex-wrap:wrap}.phase-list>li{color:var(--quiet);font-size:.9rem}.phase-list>li[aria-current=step]{color:var(--link);font-weight:650}.research-progress{padding-top:1.25rem}.research-progress>*+*{margin-top:1rem}.research-area{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-top:1px solid var(--hair)}.research-area>.quiet{white-space:nowrap}.research-clock{font-size:.9rem}.research-results{display:flex;flex-wrap:wrap;gap:.7rem}.demo-notice{font-size:.8rem;padding-top:1rem;color:var(--quiet)}.preview-dialog{max-width:34rem;width:calc(100% - 2rem);padding:1.5rem;background:var(--paper);color:var(--ink);border:1px solid var(--paper-line);border-radius:var(--card-round);box-shadow:var(--lift)}.preview-dialog>*+*{margin-top:1rem}.preview-dialog::backdrop{background:var(--scrim)}.preview-phone .research-preview{max-width:26rem;margin-left:auto;margin-right:auto}.preview-phone .source-inputs{grid-template-columns:1fr}.preview-phone .research-footer{flex-direction:column;align-items:stretch}.preview-phone .source-panel{padding:1rem}.preview-phone .research-main{padding:1.5rem 1rem 3rem}.preview-phone .toolbar{padding-left:1rem;padding-right:1rem}.preview-phone .research-area{flex-direction:column;gap:.2rem}
@media(max-width:40rem){.source-inputs{grid-template-columns:1fr}.research-main{padding-top:1.5rem}.source-panel{padding:1rem}.research-footer{align-items:stretch;flex-direction:column}.research-footer>.button{width:100%}.source-entry{gap:.6rem;grid-template-columns:2rem minmax(0,1fr) auto}.source-icon{width:2rem}.research-area{flex-direction:column;gap:.2rem}.preview-controls .input{max-width:100%}.preview-controls{gap:.4rem}.source-policy .quiet{padding-left:0}}
</style>
</head>
<body data-product="Training Studio">
<div class="preview-controls" aria-label="Design preview controls">
<p class="quiet">Interactive preview · synthetic examples · no network or assistant requests</p>
<label><span class="field-label">Studio</span><select class="input" id="studio"><option>Blog Studio</option><option>Presentation Studio</option><option selected>Training Studio</option><option>Infographic Studio</option></select></label>
<label><span class="field-label">Preview state</span><select class="input" id="scenario"><option value="sources">Source setup</option><option value="working">Researching</option><option value="attention">Needs attention</option><option value="ready">Ready</option></select></label>
<button class="button button-quiet" id="phone" type="button" aria-pressed="false">Phone width</button>
</div>
<div class="research-preview">
<header class="toolbar glass"><span class="studio-symbol" aria-hidden="true" id="symbol">T</span><div class="toolbar-title"><p class="above" id="product">Training Studio</p><h1 class="title" id="context">New training · Sources</h1></div><span class="tag">Design preview</span></header>
<main class="research-main" id="main"></main>
</div>
<dialog class="preview-dialog" id="dialog"></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const node=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const add=(n,...children)=>{n.append(...children.filter(c=>c!==null&&c!==undefined));return n;};
const button=(text,fn,filled=false)=>{const b=node('button','button'+(filled?' button-filled':''),text);b.type='button';b.addEventListener('click',fn);return b;};
const model={phase:'sources',external:false,restricted:false,workers:'auto',paused:false,pendingUrls:'',sources:[
{id:1,type:'Google Doc',title:'Product reference',origin:'Google Docs',tabs:['Overview','Implementation','Approvals'],selected:['Implementation'],status:'ready'},
{id:2,type:'PDF',title:'Background notes.pdf',origin:'Uploaded file',status:'ready'},
{id:3,type:'Web page',title:'Reference page',origin:'example.org/reference',status:'ready'}]};
const names={'Blog Studio':['New blog','blog','B'],'Presentation Studio':['New presentation','presentation','P'],'Training Studio':['New training','training','T'],'Infographic Studio':['New infographic','infographic','I']};
function check(label,checked,changed,key){const wrap=node('label','check');const box=node('input');box.type='checkbox';box.dataset.key=key||label;box.checked=checked;box.addEventListener('change',()=>changed(box.checked));add(wrap,box,node('span','',label));return wrap;}
function field(label,value='',rows){const wrap=node('label','field');const input=node(rows?'textarea':'input','input');if(rows)input.rows=rows;input.value=value;add(wrap,node('span','field-label',label),input);return {wrap,input};}
function dialog(title,...content){const d=$('dialog');d.replaceChildren(node('h2','card-title',title),...content,button('Done',()=>d.close()));d.showModal();}
function note(title,text){dialog(title,node('p','',text));}
function setPhase(phase){model.phase=phase;model.paused=false;$('scenario').value=phase;render();}
function sourceRow(source){const item=node('li','source-entry');const icon=node('span','source-icon',source.type==='Google Doc'?'DOC':source.type==='Web page'?'URL':source.type==='Text'?'TXT':source.type);icon.setAttribute('aria-hidden','true');const copy=node('div','source-copy');add(copy,node('p','row-title',source.title),node('p','quiet',source.origin));
if(source.tabs){const scope=node('details');scope.dataset.key='tabs-'+source.id;const selected=node('summary','',source.selected.length===source.tabs.length?'All '+source.tabs.length+' tabs included':source.selected.length+' of '+source.tabs.length+' tabs · '+source.selected.join(', '));scope.append(selected);scope.append(node('p','quiet','Choose the tabs to use as reference material. A tab-specific link preselects that tab.'));
for(const tab of source.tabs)scope.append(check(tab,source.selected.includes(tab),on=>{source.selected=on?[...source.selected,tab]:source.selected.filter(t=>t!==tab);render();},'tab-'+source.id+'-'+tab));copy.append(scope);}
const tools=node('div','source-tools');if(source.status==='error'){add(copy,node('p','source-warning','This source could not be read. The other sources are kept.'));tools.append(button('Try reading again',()=>{source.status='ready';render();}));}else{tools.append(button('Preview text',()=>note(source.title,'Synthetic captured-text preview. The live component will show the actual extracted text, selected tab scope, capture date and any omitted diagrams or unsupported content.')));}
copy.append(tools);const remove=button('Remove',()=>{model.sources=model.sources.filter(s=>s.id!==source.id);render();});remove.classList.add('button-quiet','source-remove');remove.setAttribute('aria-label','Remove '+source.title);return add(item,icon,copy,remove);}
function addLinks(input,problem){const links=input.value.split(/\s+/).filter(Boolean);if(!links.length){problem.textContent='Paste one or more links first.';input.focus();return;}let count=0;for(const value of links){let parsed;try{parsed=new URL(value);}catch{problem.textContent='Check this link: '+value;continue;}if(parsed.protocol!=='https:'||parsed.username||parsed.password){problem.textContent='Use an HTTPS link without embedded credentials.';continue;}const google=parsed.hostname==='docs.google.com';if(google&&!/^\/document\/d\/[^/]+/.test(parsed.pathname)&&!/^\/presentation\/d\/[^/]+/.test(parsed.pathname)){problem.textContent='Copy the Google Doc or Slides link from its Share menu.';continue;}
const tab=parsed.searchParams.get('tab');model.sources.push({id:Date.now()+count++,type:google?'Google Doc':'Web page',title:google?'Linked Google document':parsed.hostname,origin:google?'Google Docs':parsed.host+parsed.pathname,status:'ready',...(google?{tabs:tab?[tab,'Other tab']:['Overview','Details'],selected:tab?[tab]:['Overview','Details']}:{} )});}if(count){model.pendingUrls='';render();}}
function sources(){const fragment=node('div');const panel=node('section','source-panel');panel.setAttribute('aria-label','Research sources');add(panel,add(node('div','source-heading'),node('h2','card-title','Your sources'),node('span','source-count',model.sources.length+' added')));
const links=field('Web pages or Google Docs links',model.pendingUrls,3);links.input.dataset.key='urls';links.input.addEventListener('input',()=>model.pendingUrls=links.input.value);links.input.placeholder='Paste one or several links';links.input.setAttribute('aria-describedby','link-hint');const hint=node('p','field-hint','Google Docs uses your existing Marketing Studio Google account.');hint.id='link-hint';links.wrap.append(hint);const problem=node('p','source-warning');problem.setAttribute('role','alert');add(panel,add(node('div','source-inputs'),links.wrap,button('Add links',()=>addLinks(links.input,problem))),problem);
const upload=node('input');upload.type='file';upload.multiple=true;upload.accept='.pdf,.docx,.txt,.md,.html';upload.hidden=true;upload.addEventListener('change',()=>{for(const file of upload.files)model.sources.push({id:Date.now()+Math.random(),type:file.name.split('.').pop().toUpperCase(),title:file.name,origin:'Local selection · preview only',status:'ready'});render();});
const paste=()=>{const title=field('Source name','Pasted notes');const text=field('Text','',7);const use=button('Add text',()=>{if(!text.input.value.trim()){text.input.focus();return;}model.sources.push({id:Date.now(),type:'Text',title:title.input.value||'Pasted notes',origin:'Pasted text',status:'ready'});$('dialog').close();render();},true);dialog('Paste source text',title.wrap,text.wrap,use);};
add(panel,add(node('div','source-actions'),button('Choose files',()=>upload.click()),button('Paste text',paste),button('Use saved research',()=>note('Use saved research','The live component will list research in this workspace, with its purpose, date and review status. Selecting a result will verify its saved revision before reuse.'))),upload);
const list=node('ul','source-list');for(const source of model.sources)list.append(sourceRow(source));if(!model.sources.length)list.append(node('li','quiet','Add links, files or text—or allow external search below.'));panel.append(list);fragment.append(panel);
const policy=node('section','source-policy');add(policy,check('Search for additional external sources',model.external,on=>{model.external=on;render();}),node('p','quiet',model.external?'Find additional references to fill gaps and check claims.':'Use only the material listed above. Links inside it are not permission to search elsewhere.'));
if(model.external){add(policy,check('Limit additional searches to my approved sites',model.restricted,on=>{model.restricted=on;render();}),node('p','quiet',model.restricted?'Using approved sites from shared Marketing Studio settings.':'Public web search is allowed. Supplied documents are read first.'));}fragment.append(policy);
const advanced=node('details','research-advanced');advanced.dataset.key='options';advanced.append(node('summary','','Research options'));const workers=field('Research workers');const select=node('select','input');for(const[value,label]of[['auto','Automatic · up to 3'],['1','1 · sequential'],['2','Up to 2'],['3','Up to 3']]){const option=node('option','',label);option.value=value;select.append(option);}select.value=model.workers;select.addEventListener('change',()=>model.workers=select.value);workers.wrap.lastChild.replaceWith(select);add(advanced,workers.wrap,node('p','field-hint','Stays within the assistant capacity and limits already configured in Marketing Studio.'),button('Focus or avoid a topic',()=>note('Research focus','The live component will keep the audience and purpose from your studio brief, with an optional note for questions to answer or topics to avoid.')));fragment.append(advanced);
const invalid=model.sources.some(s=>s.status!=='ready'||s.tabs&&!s.selected.length);const start=button('Start research',()=>setPhase('working'),true);start.disabled=invalid||(!model.external&&!model.sources.length);const summary=invalid?'Resolve the source or select at least one tab before starting.':model.external?(model.restricted?'Use your sources and search approved sites.':'Use your sources and search the public web.'):'Use '+model.sources.length+' supplied '+(model.sources.length===1?'source':'sources')+' only.';fragment.append(add(node('div','research-footer'),node('p','quiet',summary),start));return fragment;}
function progress(){const box=node('section','source-panel research-progress');const attention=model.phase==='attention',ready=model.phase==='ready';const phases=node('ol','phase-list');for(const[label,on]of[['Collect evidence',!ready&&!attention],['Combine findings',false],['Independent check',attention],['Ready',ready]]){const li=node('li','',label);if(on)li.setAttribute('aria-current','step');phases.append(li);}box.append(phases);
add(box,node('h2','card-title',ready?'Research is ready':attention?'One area needs another try':model.paused?'Research is pausing':'Collecting evidence'),node('p','',ready?'Your connected report and brief passed their independent check.':attention?'Two completed areas are kept. Retry the affected area, then check the combined report again.':model.paused?'Current work can finish and save its evidence. New work waits until you resume.':'Your sources are being read first. Completed areas are saved as they finish.'));
if(!ready){for(const[title,status]of[['Concepts and key claims','Evidence kept'],['Practical examples','Evidence kept'],['Limits and counterevidence',attention?'Needs retry':model.paused?'Finishing current work':'Working']])box.append(add(node('div','research-area'),node('span','',title),node('span','quiet',status)));}
add(box,node('p','quiet research-clock','10 minutes elapsed · 6 minutes actively working'),node('p','field-hint','Elapsed includes waiting. Parallel assistant jobs can overlap.'));
const actions=node('div','source-actions');if(ready){actions.append(button('Open report',()=>note('Research report','A connected, cited explanation will open here, with conclusions, qualifications and links to the evidence.')),button('Open brief',()=>note('Research brief','The short brief will be shaped to the audience and purpose already supplied by the studio.')));}else if(attention){actions.append(button('Retry affected area',()=>setPhase('working'),true),button('Review source access',()=>setPhase('sources')));}else{actions.append(button(model.paused?'Resume research':'Pause research',()=>{model.paused=!model.paused;render();}),button('Stop research',()=>{dialog('Stop research?',node('p','','The live studio will cancel its workers and keep completed evidence. In-flight work remains visible until cancellation is confirmed.'),button('Stop this preview',()=>{$('dialog').close();setPhase('attention');},true));}));}box.append(actions);
const details=node('details','research-advanced');add(details,node('summary','','Research details'),node('p','quiet','3 research areas · automatic worker limit, up to 3'),node('p','quiet','14 minutes total assistant time · dollar cost not reported'),node('p','field-hint','This preview shows illustrative timing. The real component will use recorded work intervals and supported cost reporting.'));box.append(details);const fragment=add(node('div'),box);if(ready)fragment.append(add(node('div','research-footer'),node('p','quiet','Saved locally. Sharing follows your studio settings.'),button('Use research',()=>note('Research selected','In the live studio this will attach this exact reviewed report and continue the existing workflow.'),true)));return fragment;}
function render(){const focused=document.activeElement?.dataset?.key;const opened=[...document.querySelectorAll('details[open][data-key]')].map(d=>d.dataset.key);const product=$('studio').value;document.body.dataset.product=product;const [context,thing,symbol]=names[product];$('product').textContent=product;$('context').textContent=context+' · Research';$('symbol').textContent=symbol;const main=$('main');main.replaceChildren();add(main,add(node('header'),node('h2','large-title',model.phase==='sources'?'Give your research a starting point':'Research for your '+thing),node('p','lede',model.phase==='sources'?'Bring what you have. Choose whether to look beyond it.':'One connected report, grounded in the sources.')),
add(node('div','research-intent'),node('p','row-title','Explain the topic clearly, with examples and practical limits.'),node('p','quiet','Audience and purpose come from your '+thing+' brief.')),
model.phase==='sources'?sources():progress(),node('p','demo-notice','Design preview only. Links are not fetched, files are not uploaded, and no assistant jobs start.'));for(const detail of main.querySelectorAll('details[data-key]'))detail.open=opened.includes(detail.dataset.key);if(focused){const control=[...main.querySelectorAll('[data-key]')].find(n=>n.dataset.key===focused);control?.focus();}
}
$('studio').addEventListener('change',render);$('scenario').addEventListener('change',()=>setPhase($('scenario').value));$('phone').addEventListener('click',()=>{const on=document.body.classList.toggle('preview-phone');$('phone').setAttribute('aria-pressed',String(on));});render();
</script>
</body>
</html>
