<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc"><title id="title">One route for every piece of work</title><desc id="desc">Every studio follows the same four phases: Brief, Plan, Make and Ship. Blog Studio: Topic, sources, kind of post, Angle and outline, Draft, check, accept or reject, Finishing and send. Presentation Studio: Idea, document or deck, Slide story and slide text, Design, review, one fix pass, Deliver. Training Studio: Topic, audience and levels, Outline and research, Guides, briefs, practice, decks, Mark ready and share. Infographic Studio: Brief and sources, Choose the story, Build, preview and edit, Approve and export. Illustration, not a screenshot.</desc><defs><linearGradient id="reach" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#dfe9f9"/><stop offset="0.62" stop-color="#eef3fb"/><stop offset="0.86" stop-color="#ffffff"/></linearGradient></defs><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><rect x="0" y="0" width="1280" height="470" rx="20" fill="#f3f6fa" stroke="none"/><text x="48" y="58" font-size="28" fill="#17243a" font-weight="700">One route for every piece of work</text><text x="48" y="90" font-size="17" fill="#526176" font-weight="400">You always see where the work is, what is happening now, and what is next.</text><rect x="48" y="116" width="1184" height="118" rx="18" fill="url(#reach)" stroke="#c9d7ee"/><line x1="296" y1="158" x2="490" y2="158" stroke="#2463c4" stroke-width="5" stroke-linecap="round"/><circle cx="268" cy="158" r="19" fill="#2463c4"/><path d="M260 158l6 6 11-12" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="249" y="204" font-size="19" fill="#17243a" font-weight="700">Brief</text><text x="249" y="224" font-size="14" fill="#526176" font-weight="400">What it is for</text><line x1="540" y1="158" x2="734" y2="158" stroke="#2463c4" stroke-width="5" stroke-linecap="round"/><circle cx="512" cy="158" r="19" fill="#2463c4"/><path d="M504 158l6 6 11-12" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="493" y="204" font-size="19" fill="#17243a" font-weight="700">Plan</text><text x="493" y="224" font-size="14" fill="#526176" font-weight="400">Its outline and sources</text><line x1="784" y1="158" x2="978" y2="158" stroke="#aab7c9" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/><circle cx="756" cy="158" r="27" fill="#2463c4" opacity="0.14"/><circle cx="756" cy="158" r="19" fill="#ffffff" stroke="#2463c4" stroke-width="3.5"/><text x="751" y="164" font-size="17" fill="#2463c4" font-weight="800">3</text><text x="737" y="204" font-size="19" fill="#17243a" font-weight="700">Make</text><text x="737" y="224" font-size="14" fill="#526176" font-weight="400">Drafts, checks and review</text><circle cx="1000" cy="158" r="19" fill="#ffffff" stroke="#aab7c9" stroke-width="2.5"/><text x="995" y="164" font-size="17" fill="#6b7a90" font-weight="700">4</text><text x="981" y="204" font-size="19" fill="#526176" font-weight="700">Ship</text><text x="981" y="224" font-size="14" fill="#526176" font-weight="400">Finish and share</text><text x="72" y="164" font-size="15" fill="#2463c4" font-weight="700">Every desk</text><text x="72" y="185" font-size="15" fill="#2463c4" font-weight="700">shows this</text><rect x="48" y="262" width="1184" height="38" rx="10" fill="#ffffff" stroke="#d8e0ea"/><rect x="48" y="262" width="8" height="38" rx="4" fill="#2463c4" stroke="none"/><text x="72" y="287" font-size="15" fill="#2463c4" font-weight="700">Blog Studio</text><text x="249" y="287" font-size="14.5" fill="#263449" font-weight="500">Topic, sources, kind of post</text><text x="493" y="287" font-size="14.5" fill="#263449" font-weight="500">Angle and outline</text><text x="737" y="287" font-size="14.5" fill="#263449" font-weight="500">Draft, check, accept or reject</text><text x="981" y="287" font-size="14.5" fill="#263449" font-weight="500">Finishing and send</text><rect x="48" y="310" width="1184" height="38" rx="10" fill="#ffffff" stroke="#d8e0ea"/><rect x="48" y="310" width="8" height="38" rx="4" fill="#a64b12" stroke="none"/><text x="72" y="335" font-size="15" fill="#a64b12" font-weight="700">Presentation Studio</text><text x="249" y="335" font-size="14.5" fill="#263449" font-weight="500">Idea, document or deck</text><text x="493" y="335" font-size="14.5" fill="#263449" font-weight="500">Slide story and slide text</text><text x="737" y="335" font-size="14.5" fill="#263449" font-weight="500">Design, review, one fix pass</text><text x="981" y="335" font-size="14.5" fill="#263449" font-weight="500">Deliver</text><rect x="48" y="358" width="1184" height="38" rx="10" fill="#ffffff" stroke="#d8e0ea"/><rect x="48" y="358" width="8" height="38" rx="4" fill="#7442b4" stroke="none"/><text x="72" y="383" font-size="15" fill="#7442b4" font-weight="700">Training Studio</text><text x="249" y="383" font-size="14.5" fill="#263449" font-weight="500">Topic, audience and levels</text><text x="493" y="383" font-size="14.5" fill="#263449" font-weight="500">Outline and research</text><text x="737" y="383" font-size="14.5" fill="#263449" font-weight="500">Guides, briefs, practice, decks</text><text x="981" y="383" font-size="14.5" fill="#263449" font-weight="500">Mark ready and share</text><rect x="48" y="406" width="1184" height="38" rx="10" fill="#ffffff" stroke="#d8e0ea"/><rect x="48" y="406" width="8" height="38" rx="4" fill="#087b7b" stroke="none"/><text x="72" y="431" font-size="15" fill="#087b7b" font-weight="700">Infographic Studio</text><text x="249" y="431" font-size="14.5" fill="#263449" font-weight="500">Brief and sources</text><text x="493" y="431" font-size="14.5" fill="#263449" font-weight="500">Choose the story</text><text x="737" y="431" font-size="14.5" fill="#263449" font-weight="500">Build, preview and edit</text><text x="981" y="431" font-size="14.5" fill="#263449" font-weight="500">Approve and export</text></g></svg>
