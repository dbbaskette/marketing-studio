<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1099" viewBox="0 0 480 1099" role="img" aria-labelledby="title desc">
<title id="title">Presentation Studio workflow, part 1 of 2: Start and slide text</title>
<desc id="desc">Steps in order: Open Presentation Studio (Shared setup the first time); New deck (Idea, document or existing deck); Quick scan (For researched ideas or material); Review the slide story (Edit sections and research gaps); Research approved sections (Up to 3 active investigators); Combine section drafts (Retry unfinished contributions); Check the assembled research (Independent whole-report check); Draft the slide text (Titles, words, speaker notes); Review slide text (Fix words where they are); Approve text &amp; design deck (Design starts from this text). Approve story &amp; research leads from Review the slide story to Research approved sections. Review slide text can go to Ask for changes (Slide text redrafted) and come back. Colours: filled boxes are your decisions or input, tinted boxes are assistant work and grey boxes are studio steps.</desc>
<style>svg{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif}.title{font-weight:600}.bold{font-weight:700}.page,.you,.assistant,.studio{stroke-width:0.5}.wire{stroke-width:1.1}.page{fill:#ffffff;stroke:#d9dee6}.ink{fill:#1c1d22}.quiet{fill:#565a69}.accent-text{fill:#ac421d}.you{fill:#ac421d;stroke:#ac421d}.you-text{fill:#ffffff}.assistant{fill:#fff0e8;stroke:#ac421d}.studio{fill:#eef1f5;stroke:#a9b1bf}.wire{fill:none;stroke:#6b7080}.tip{fill:#6b7080}@media (prefers-color-scheme:dark){.page{fill:#191f29;stroke:#39404d}.ink{fill:#f3f4f8}.quiet{fill:#abb0c0}.accent-text{fill:#ffb493}.you{fill:#ffb493;stroke:#ffb493}.you-text{fill:#151c29}.assistant{fill:#452c24;stroke:#ffb493}.studio{fill:#262d39;stroke:#5d6576}.wire{fill:none;stroke:#9aa0b0}.tip{fill:#9aa0b0}}</style>
