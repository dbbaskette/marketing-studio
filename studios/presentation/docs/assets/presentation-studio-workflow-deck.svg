<svg xmlns="http://www.w3.org/2000/svg" width="660" height="701" viewBox="0 0 660 701" role="img" aria-labelledby="title desc">
<title id="title">Presentation Studio workflow, part 2 of 2: Design, refine and deliver</title>
<desc id="desc">Steps in order: Draw look samples (One slide in each look); Pick the look (Only if you chose to); Design the deck (Harness Slides, in your brand); On the desk (Words, notes, Finishing); Deliver (Google Slides or PowerPoint); Delivered (Open or download revision N). Draw the deck in this look leads from Pick the look to Design the deck. On the desk can go to Redraw slide N (Its section is redrawn) and come back. Delivered can lead to A note or an edit (Makes the next revision). A note or an edit (Makes the next revision) returns to On the desk. Colours: filled boxes are your decisions or input, tinted boxes are assistant work and grey boxes are studio steps.</desc>
<style>svg{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif}.title{font-weight:600}.bold{font-weight:700}.page,.you,.assistant,.studio{stroke-width:0.5}.wire{stroke-width:1.1}.page{fill:#ffffff;stroke:#d9dee6}.ink{fill:#1c1d22}.quiet{fill:#565a69}.accent-text{fill:#ac421d}.you{fill:#ac421d;stroke:#ac421d}.you-text{fill:#ffffff}.assistant{fill:#fff0e8;stroke:#ac421d}.studio{fill:#eef1f5;stroke:#a9b1bf}.wire{fill:none;stroke:#6b7080}.tip{fill:#6b7080}@media (prefers-color-scheme:dark){.page{fill:#191f29;stroke:#39404d}.ink{fill:#f3f4f8}.quiet{fill:#abb0c0}.accent-text{fill:#ffb493}.you{fill:#ffb493;stroke:#ffb493}.you-text{fill:#151c29}.assistant{fill:#452c24;stroke:#ffb493}.studio{fill:#262d39;stroke:#5d6576}.wire{fill:none;stroke:#9aa0b0}.tip{fill:#9aa0b0}}</style>
