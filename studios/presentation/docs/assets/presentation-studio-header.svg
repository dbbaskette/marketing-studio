<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">Presentation Studio</title><desc id="desc">Workflow illustration: Idea, document or deck. Approve slide text. Refine the design. Choose Deliver. Illustrated interface, not a screenshot.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><rect x="0" y="0" width="1280" height="440" rx="20" fill="#f3f6fa" stroke="none"/><rect x="0" y="0" width="1280" height="12" rx="0" fill="#a64b12" stroke="none"/><g transform="translate(48 49)" fill="none" stroke="#a64b12" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="33" height="23" rx="3"/><path d="M18 26v9 M10 35h16 M9 19l6-7 6 3 7-6"/></g><text x="101" y="76" font-size="28" fill="#17243a" font-weight="700">Presentation Studio</text><text x="48" y="149" font-size="28" fill="#17243a" font-weight="650">Your story. Your brand. Every slide considered.</text><text x="48" y="191" font-size="19" fill="#526176" font-weight="400">Local work. Your assistant. Your decisions.</text><text x="48" y="260" font-size="13" fill="#a64b12" font-weight="650">A DESK FOR THE WORK, FROM START TO FINISH</text><rect x="804" y="66" width="412" height="228" rx="16" fill="#ffffff" stroke="#d8e0ea"/><rect x="805" y="67" width="410" height="38" rx="15" fill="#edf2f8" stroke="none"/><text x="824" y="92" font-size="12" fill="#526176" font-weight="650">THE WORKBENCH</text><rect x="822" y="120" width="46" height="38" rx="5" fill="#edf2f8" stroke="none"/><text x="839" y="145" font-size="13" fill="#526176" font-weight="400">1</text><rect x="822" y="170" width="46" height="38" rx="5" fill="#edf2f8" stroke="none"/><text x="839" y="195" font-size="13" fill="#526176" font-weight="400">2</text><rect x="822" y="220" width="46" height="38" rx="5" fill="#edf2f8" stroke="none"/><text x="839" y="245" font-size="13" fill="#526176" font-weight="400">3</text><rect