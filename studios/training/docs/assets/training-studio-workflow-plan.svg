<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1016" viewBox="0 0 480 1016" role="img" aria-labelledby="title desc">
<title id="title">Training Studio workflow, part 1 of 2: Plan</title>
<desc id="desc">Steps in order: Open Training Studio (Shared setup the first time); New training (Goal, materials, sources); Quick scan (One bounded provisional outline); Review the training outline (Edit sections and questions); Research approved sections (Up to 3 active investigators); Combine section drafts (Keep completed contributions); Check the assembled research (Independent whole-report check); Teaching plans (Approved scope and checked evidence); Build selected materials (No second topics approval). Approve outline &amp; research leads from Review the training outline to Research approved sections. Review the training outline can go to Edit locally (No assistant job) and come back. Colours: filled boxes are your decisions or input, tinted boxes are assistant work and grey boxes are studio steps.</desc>
<style>svg{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif}.title{font-weight:600}.bold{font-weight:700}.page,.you,.assistant,.studio{stroke-width:0.5}.wire{stroke-width:1.1}.page{fill:#ffffff;stroke:#d9dee6}.ink{fill:#1c1d22}.quiet{fill:#565a69}.accent-text{fill:#7140b4}.you{fill:#7140b4;stroke:#7140b4}.you-text{fill:#ffffff}.assistant{fill:#f2eaff;stroke:#7140b4}.studio{fill:#eef1f5;stroke:#a9b1bf}.wire{fill:none;stroke:#6b7080}.tip{fill:#6b7080}@media (prefers-color-scheme:dark){.page{fill:#191f29;stroke:#39404d}.ink{fill:#f3f4f8}.quiet{fill:#abb0c0}.accent-text{fill:#d2b1ff}.you{fill:#d2b1ff;stroke:#d2b1ff}.you-text{fill:#151c29}.assistant{fill:#342947;stroke:#d2b1ff}.studio{fill:#262d39;stroke:#5d6576}.wire{fill:none;stroke:#9aa0b0}.tip{fill:#9aa0b0}}</style>
