<svg xmlns="http://www.w3.org/2000/svg" width="480" height="701" viewBox="0 0 480 701" role="img" aria-labelledby="title desc">
<title id="title">Infographic Studio workflow, part 1 of 2: Story and build</title>
<desc id="desc">Steps in order: Open Infographic Studio (Shared setup the first time); New infographic (Add information, set direction); Find the story (Source-backed stories proposed); Choose the story (Use this story); Build page (Composed with your brand); Update preview (Rendered on this computer). Save brief leads from New infographic to Find the story. Choose the story can go to Ask for a revision (A revised story to choose) and come back. Colours: filled boxes are your decisions or input, tinted boxes are assistant work and grey boxes are studio steps.</desc>
