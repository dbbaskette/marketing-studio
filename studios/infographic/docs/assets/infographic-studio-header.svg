<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">Infographic Studio</title><desc id="desc">Workflow illustration: Sources and facts. Choose a story. Refine the page. Approve and export. Illustrated interface, not a screenshot.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><rect x="0" y="0" width="1280" height="440" rx="20" fill="#f3f6fa" stroke="none"/><rect x="0" y="0" width="1280" height="12" rx="0" fill="#087b7b" stroke="none"/><g transform="translate(48 49)" fill="none" stroke="#087b7b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="29" height="34" rx="4"/><path d="M9 10h17 M9 17h7 M9 23h12 M9 29h17"/></g><text x="101" y="76" font-size="28" fill="#17243a" font-weight="700">Infographic Studio</text><text x="48" y="149" font-size="28" fill="#17243a" font-weight="650">Make the important idea visible.</text><text x="48" y="191" font-size="19" fill="#526176" font-weight="400">Local work. Your assistant. Your decisions.</text><text x="48" y="260" font-size="13" fill="#087b7b" font-weight="650">A DESK FOR THE WORK, FROM START TO FINISH</text><rect x="804" y="66" width="412" height="228" rx="16" fill="#ffffff" stroke="#d8e0ea"/><rect x="805" y="67" width="410" height="38" rx="15" fill="#edf2f8" stroke="none"/><text x="824" y="92" font-size="12" fill="#526176" font-weight="650">THE WORKBENCH</text><rect x="826" y="119" width="117" height="155" rx="7" fill="#f8fafc" stroke="#e1e7ef"/><rect x="841" y="136" width="75" height="6" rx="2" fill="#087b7b" stroke="none"/><circle cx="853" cy="166" r="9" fill="#087b7b"/><rect x="871" y="162" width="57" height="4" rx="2" fill="#c4cedb" stroke="none"/><circle cx="853" cy="200" r="9" fill="#087b7b"/><rect x="871" y="196" width="57" height="4" rx="2" fill="#c4cedb" stroke="none"/><circle cx="853" cy="234" r="9" fill="#087b7b"/><rect x="871" y="230" width="57" heig