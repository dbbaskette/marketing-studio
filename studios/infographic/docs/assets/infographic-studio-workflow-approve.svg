<svg xmlns="http://www.w3.org/2000/svg" width="660" height="718" viewBox="0 0 660 718" role="img" aria-labelledby="title desc">
<title id="title">Infographic Studio workflow, part 2 of 2: Review, approve and prepare</title>
<desc id="desc">Steps in order: Edit words (Each save, a new revision); Review page (Record what you inspected); Run checks (Checks on this computer); Approve revision N (This checked revision only); Prepare approved files (PNG, PDF, SVG and text); Deliver approved page (Optional: Google Doc, PDF). Record review and run checks leads from Review page to Run checks. Run checks can lead to Repair findings (Then Review page again). Repair findings (Then Review page again) returns to Review page. Approve revision N can lead to A later change (Withdraws the approval). A later change (Withdraws the approval) returns to Edit words. Colours: filled boxes are your decisions or input, tinted boxes are assistant work and grey boxes are studio steps.</desc>
<style>svg{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif}.title{font-weight:600}.bold{font-weight:700}.page,.you,.assistant,.studio{stroke-width:0.5}.wire{stroke-width:1.1}.page{fill:#ffffff;stroke:#d9dee6}.ink{fill:#1c1d22}.quiet{fill:#565a69}.accent-text{fill:#146970}.you{fill:#146970;stroke:#146970}.you-text{fill:#ffffff}.assistant{fill:#e5f4f3;stroke:#146970}.studio{fill:#eef1f5;stroke:#a9b1bf}.wire{fill:none;stroke:#6b7080}.tip{fill:#6b7080}@media (prefers-color-scheme:dark){.page{fill:#191f29;stroke:#39404d}.ink{fill:#f3f4f8}.quiet{fill:#abb0c0}.accent-text{fill:#8cdedb}.you{fill:#8cdedb;stroke:#8cdedb}.you-text{fill:#151c29}.assistant{fill:#1c383b;stroke:#8cdedb}.studio{fill:#262d39;stroke:#5d6576}.wire{fill:none;stroke:#9aa0b0}.tip{fill:#9aa0b0}}</style>
