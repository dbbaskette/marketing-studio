name: Release
# Publishes the version in skills/blog-studio/VERSION once: a merge that changes
# VERSION creates the tag and its GitHub Release; every other push is a no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blog-studio-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read the version and look for its tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < skills/blog-studio/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must be a release number such as 2.0.0" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || status=$?
          case "$status" in
            0) echo "released=true" >> "$GITHUB_OUTPUT"; echo "v$version is already released; nothing to do." ;;
            2) echo "released=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Could not read the repository tags." >&2; exit 1 ;;
          esac
      - uses: actions/setup-python@v5
        if: steps.version.outputs.released == 'false'
        with:
          python-version: '3.13'
      - name: Install the pinned linter
        if: steps.version.outputs.released == 'false'
        run: python -m pip install -r requirements-dev.txt
      - name: Run project checks
        if: steps.version.outputs.released == 'false'
        shell: bash
        env:
          BLOG_STUDIO_REQUIRE_LINT: '1'
        run: bash scripts/ci/check.sh "$(command -v python)" "$RUNNER_TEMP/blog-studio-checks"
      - name: Build release archives
        if: steps.version.outputs.released == 'false'
        run: python scripts/build.py --output build
      - name: Create the tag and GitHub Release
        if: steps.version.outputs.released == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Release notes are this version's section of CHANGELOG.md.
          awk -v heading="## $VERSION" 'index($0, heading) == 1 {found = 1; next} /^## / {found = 0} found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "Blog Studio $VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" build/*.zip build/*.zip.sha256 \
            --target "$GITHUB_SHA" --title "Blog Studio $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
