name: Verify Blog Studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: blog-studio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The command list lives in scripts/ci/check.sh so CI, releases and local runs agree.
      - name: Run project checks
        shell: bash
        run: bash scripts/ci/check.sh "$(command -v python)" "$RUNNER_TEMP/blog-studio-checks"
