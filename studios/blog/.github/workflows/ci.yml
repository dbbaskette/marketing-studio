# The same checks on GitHub-hosted machines. The pull request gate is the Tart workflow
# (verify-tart.yml, "Verify Blog Studio"); see docs/local-ci.md.
name: Hosted checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: blog-studio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hosted:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned linter
        run: python -m pip install -r requirements-dev.txt
      # The command list lives in scripts/ci/check.sh so CI, releases and local runs agree.
      - name: Run project checks
        shell: bash
        env:
          BLOG_STUDIO_REQUIRE_LINT: '1'
        run: bash scripts/ci/check.sh "$(command -v python)" "$RUNNER_TEMP/blog-studio-checks"
