<svg xmlns="http://www.w3.org/2000/svg" width="480" height="756" viewBox="0 0 480 756" role="img" aria-labelledby="title desc">
<title id="title">Blog Studio workflow, part 1 of 3: Start and write</title>
<desc id="desc">Steps in order: Open Blog Studio (Shared setup the first time); New blog (Idea and sources); Writing preferences (Length, tone, GEO review); Research, outline, draft (Nothing needed from you); GEO review (Only if you included it); The desk (Read, Edit section, Full desk). Open Blog Studio can lead to Edit or polish a draft (Paste, upload, Doc or link). Edit or polish a draft leads to What should happen first (Choose the first pass). What should happen first leads to First pass (Spelling, feedback, GEO, reshape). First pass (Spelling, feedback, GEO, reshape) returns to The desk. Colours: filled boxes are your decisions or input, tinted boxes are assistant work and grey boxes are studio steps.</desc>
<style>svg{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif}.title{font-weight:600}.bold{font-weight:700}.page,.you,.assistant,.studio{stroke-width:0.5}.wire{stroke-width:1.1}.page{fill:#ffffff;stroke:#d9dee6}.ink{fill:#1c1d22}.quiet{fill:#565a69}.accent-text{fill:#175fba}.you{fill:#175fba;stroke:#175fba}.you-text{fill:#ffffff}.assistant{fill:#e8f1ff;stroke:#175fba}.studio{fill:#eef1f5;stroke:#a9b1bf}.wire{fill:none;stroke:#6b7080}.tip{fill:#6b7080}@media (prefers-color-scheme:dark){.page{fill:#191f29;stroke:#39404d}.ink{fill:#f3f4f8}.quiet{fill:#abb0c0}.accent-text{fill:#9cc4ff}.you{fill:#9cc4ff;stroke:#9cc4ff}.you-text{fill:#151c29}.assistant{fill:#213653;stroke:#9cc4ff}.studio{fill:#262d39;stroke:#5d6576}.wire{fill:none;stroke:#9aa0b0}.tip{fill:#9aa0b0}}</style>
