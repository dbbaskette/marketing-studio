<svg xmlns="http://www.w3.org/2000/svg" width="568" height="852" viewBox="0 0 568 852" role="img" aria-labelledby="title desc">
<title id="title">Blog Studio workflow, part 2 of 3: Finish and send</title>
<desc id="desc">Steps in order: The desk (Edit, notes, select a passage); Finishing (Copy edit, facts, reader aids); Apply, Edit or Skip (Each proposal waits for you); Pre-publish check (Headings, links, evidence); Run GEO review (Says when it is out of date); Send to Google Doc (Make a Google Doc first, if none); Mark as published (Records where it went). The desk can go to Revise the draft (A section or the whole) and come back. Send to Google Doc can lead to Bring accepted changes (Back onto the desk). Bring accepted changes (Back onto the desk) returns to The desk. Colours: filled boxes are your decisions or input, tinted boxes are assistant work and grey boxes are studio steps.</desc>
<style>svg{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif}.title{font-weight:600}.bold{font-weight:700}.page,.you,.assistant,.studio{stroke-width:0.5}.wire{stroke-width:1.1}.page{fill:#ffffff;stroke:#d9dee6}.ink{fill:#1c1d22}.quiet{fill:#565a69}.accent-text{fill:#175fba}.you{fill:#175fba;stroke:#175fba}.you-text{fill:#ffffff}.assistant{fill:#e8f1ff;stroke:#175fba}.studio{fill:#eef1f5;stroke:#a9b1bf}.wire{fill:none;stroke:#6b7080}.tip{fill:#6b7080}@media (prefers-color-scheme:dark){.page{fill:#191f29;stroke:#39404d}.ink{fill:#f3f4f8}.quiet{fill:#abb0c0}.accent-text{fill:#9cc4ff}.you{fill:#9cc4ff;stroke:#9cc4ff}.you-text{fill:#151c29}.assistant{fill:#213653;stroke:#9cc4ff}.studio{fill:#262d39;stroke:#5d6576}.wire{fill:none;stroke:#9aa0b0}.tip{fill:#9aa0b0}}</style>
