<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">Blog Studio</title><desc id="desc">Workflow illustration: Bring your material. Write on the desk. Review suggestions. Send when ready. Illustrated interface, not a screenshot.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><rect x="0" y="0" width="1280" height="440" rx="20" fill="#f3f6fa" stroke="none"/><rect x="0" y="0" width="1280" height="12" rx="0" fill="#2463c4" stroke="none"/><g transform="translate(48 49)" fill="none" stroke="#2463c4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h17l7 7v26H7z M23 2v9h8 M12 17h14 M12 23h14 M12 29h9"/></g><text x="101" y="76" font-size="28" fill="#17243a" font-weight="700">Blog Studio</text><text x="48" y="149" font-size="28" fill="#17243a" font-weight="650">From a rough idea to words worth sharing.</text><text x="48" y="191" font-size="19" fill="#526176" font-weight="400">Local work. Your assistant. Your decisions.</text><text x="48" y="260" font-size="13" fill="#2463c4" font-weight="650">A DESK FOR THE WORK, FROM START TO FINISH</text><rect x="804" y="66" width="412" height="228" rx="16" fill="#ffffff" stroke="#d8e0ea"/><rect x="805" y="67" width="410" height="38" rx="15" fill="#edf2f8" stroke="none"/><text x="824" y="92" font-size="12" fill="#526176" font-weight="650">THE WORKBENCH</text><rect x="824" y="120" width="237" height="153" rx="8" fill="#f8fafc" stroke="#e1e7ef"/><rect x="1080" y="120" width="116" height="153" rx="8" fill="#f8fafc" stroke="#e1e7ef"/><text x="1093" y="144" font-size="13" fill="#263449" font-weight="600">Finishing</text><rect x="841" y="140" width="170" height="5" rx="2" fill="#2463c4" stroke="none"/><rect x="841" y="156" width="198" height="5" rx="2" fill="#c4cedb" stroke="none"/><rect x="841" y="172" width="185" height="5" rx="2" fill="#c4cedb" stroke="none"/><rect x="841" y="188" width="198" height="5" rx="2" fill="#c4cedb" stroke="none"/><rect x="841" y="204" width="160" height="5" rx="2" fill="#c4cedb" stroke="none"/><rect x="841" y="220" width="191" height="5" rx="2" fill="#c4cedb" stroke="none"/><rect x="841" y="236" width="180" height="5" rx="2" fill="#c4cedb" stroke="none"/><rect x="1093" y="161" width="89" height="17" rx="4" fill="#e5ecf5" stroke="none"/><rect x="1093" y="189" width="89" height="17" rx="4" fill="#e5ecf5" stroke="none"/><rect x="1093" y="217" width="89" height="17" rx="4" fill="#e5ecf5" stroke="none"/><rect x="48" y="331" width="280" height="62" rx="10" fill="#ffffff" stroke="#d8e0ea"/><circle cx="73" cy="362" r="13" fill="#2463c4"/><text x="69" y="367" font-size="13" fill="#ffffff" font-weight="700">1</text><text x="97" y="367" font-size="16" fill="#263449" font-weight="600">Bring your material</text><rect x="352" y="331" width="280" height="62" rx="10" fill="#ffffff" stroke="#d8e0ea"/><circle cx="377" cy="362" r="13" fill="#2463c4"/><text x="373" y="367" font-size="13" fill="#ffffff" font-weight="700">2</text><text x="401" y="367" font-size="16" fill="#263449" font-weight="600">Write on the desk</text><rect x="656" y="331" width="280" height="62" rx="10" fill="#ffffff" stroke="#d8e0ea"/><circle cx="681" cy="362" r="13" fill="#2463c4"/><text x="677" y="367" font-size="13" fill="#ffffff" font-weight="700">3</text><text x="705" y="367" font-size="16" fill="#263449" font-weight="600">Review suggestions</text><rect x="960" y="331" width="280" height="62" rx="10" fill="#ffffff" stroke="#d8e0ea"/><circle cx="985" cy="362" r="13" fill="#2463c4"/><text x="981" y="367" font-size="13" fill="#ffffff" font-weight="700">4</text><text x="1009" y="367" font-size="16" fill="#263449" font-weight="600">Send when ready</text></g></svg>
